<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mis Proyectos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f6f7f8;--bg3:#f0f1f3;
  --text:#111;--text2:#555;--text3:#999;
  --border:#e0e0e0;--border2:#ccc;
  --green:#1D9E75;--green-light:#E1F5EE;
  --blue:#378ADD;--blue-light:#E6F1FB;
  --orange:#D85A30;--orange-light:#FAECE7;
  --purple:#7F77DD;--purple-light:#EEEDFE;
  --amber:#EF9F27;--amber-light:#FAEEDA;
  --red:#d63939;--red-light:#fdebeb;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a1a;--bg2:#242424;--bg3:#2c2c2c;
    --text:#f0f0f0;--text2:#aaa;--text3:#666;
    --border:#333;--border2:#444;
    --green-light:#0a3326;--blue-light:#0a1e35;
    --orange-light:#3a1a0a;--purple-light:#1a1845;
    --amber-light:#3a2500;--red-light:#3d1010;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* ── LOADING ── */
#loading-overlay{position:fixed;inset:0;background:var(--bg);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LAYOUT COMMON ── */
.screen{display:none;max-width:1100px;margin:0 auto;padding:20px 16px}
.screen.active{display:block}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:34px;height:34px;border-radius:var(--radius);background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.brand h1{font-size:16px;font-weight:600;color:var(--text)}
.brand p{font-size:11px;color:var(--text3);margin-top:1px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── BUTTONS ── */
.btn{padding:7px 14px;border-radius:var(--radius);font-size:13px;cursor:pointer;border:1px solid var(--border2);background:var(--bg);color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:background .15s;text-decoration:none;position:relative}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-primary:hover{background:#0f6e56;color:#fff}
.btn-danger{color:#c00;border-color:#fcc}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}

/* ── PROJECT CARDS (home) ── */
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:10px}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:24px}
.project-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
.project-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);border-color:var(--border2)}
.pc-accent{position:absolute;top:0;left:0;right:0;height:3px}
.pc-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;margin-top:6px;line-height:1.3;padding-right:20px;}
.pc-client{font-size:12px;color:var(--text2);margin-bottom:12px}
.pc-meta{display:flex;gap:12px;font-size:11px;color:var(--text3)}
.pc-meta span{display:flex;align-items:center;gap:4px}
.pc-pbar{height:4px;background:var(--border);border-radius:2px;margin-top:10px;overflow:hidden}
.pc-pbar-inner{height:100%;border-radius:2px}
.pc-type-badge{position:absolute;top:14px;right:14px;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge-propuesta{background:var(--amber-light);color:#8a5c00}
.badge-proyecto{background:var(--green-light);color:var(--green)}
.new-card{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:130px;color:var(--text3)}
.new-card:hover{border-color:var(--green);background:var(--green-light);color:var(--green)}
.new-card i{font-size:24px}
.new-card span{font-size:13px;font-weight:500}
.delete-proj-btn{position:absolute;bottom:12px;right:12px;padding:5px;font-size:14px;border:none;background:transparent;color:var(--text3);cursor:pointer;transition:color .15s}
.delete-proj-btn:hover{color:var(--red)}

/* ── BACK BUTTON / PROJECT TOPBAR ── */
.proj-topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.proj-title-area h1{font-size:17px;font-weight:600;color:var(--text)}
.proj-title-area p{font-size:12px;color:var(--text2);margin-top:3px}

/* ── TABS ── */
.tab-row{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0;overflow-x:auto;scrollbar-width:none;}
.tab-row::-webkit-scrollbar{display:none;}
.tab{padding:8px 16px;border-radius:var(--radius) var(--radius) 0 0;font-size:13px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text2);margin-bottom:-1px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tab.active{background:var(--bg);border-color:var(--border);border-bottom-color:var(--bg);color:var(--text);font-weight:500}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--border)}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:600;color:var(--text)}
.stat-sub{font-size:11px;color:var(--text3);margin-top:2px}
.week-progress{background:var(--bg2);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;border:1px solid var(--border)}
.week-progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px}
.pbar-outer{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.pbar-inner{height:100%;background:var(--green);border-radius:4px;transition:width .4s}

/* ── TASK LIST ── */
.section{margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg2);cursor:pointer;user-select:none;gap:10px}
.section-title{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;flex:1;color:var(--text)}
.section-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2);flex-shrink:0}
.pbar-sm{width:70px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.pbar-sm-inner{height:100%;border-radius:3px}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:8px 14px;border-top:1px solid var(--border);cursor:pointer;transition:background .12s}
.task-row:hover{background:var(--bg2)}
.task-row.done .task-name{text-decoration:line-through;color:var(--text3)}
.status-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.si-pendiente{color:var(--border2)}.si-curso{color:var(--blue)}.si-retrasado{color:var(--red)}.si-completado{color:var(--green)}
.task-info{flex:1;min-width:0}
.task-name{font-size:13px;color:var(--text);line-height:1.4}
.task-date{font-size:11px;color:var(--text3);margin-top:2px}
.task-right{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-producto{background:var(--blue-light);color:var(--blue)}
.badge-revision{background:var(--amber-light);color:#8a5c00}
.badge-hito{background:#fff0f0;color:#c00}
.badge-tarea{background:var(--bg3);color:var(--text2)}
.add-task-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;font-size:12px;color:var(--text2);cursor:pointer;border-top:1px dashed var(--border);transition:background .12s}
.add-task-btn:hover{background:var(--bg2);color:var(--text)}

/* ── SUBTASKS ── */
.subtask-indented{padding:6px 14px 6px 44px;background:var(--bg);border-top:1px dashed var(--border);display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;transition:background .12s}
.subtask-indented:hover{background:var(--bg2)}
.subtask-indented .st-name{flex:1;color:var(--text2)}
.subtask-indented.done .st-name{text-decoration:line-through;color:var(--text3)}

/* ── KANBAN ── */
.board-container{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.board-col{flex:1;min-width:240px;background:var(--bg2);border-radius:var(--radius-lg);padding:12px;border:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.board-col h3{font-size:13px;font-weight:600;display:flex;justify-content:space-between;margin-bottom:4px;border-bottom:2px solid var(--border);padding-bottom:8px}
.board-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .1s;border-left:4px solid var(--border2)}
.board-card:hover{transform:translateY(-2px)}
.bc-title{font-size:13px;font-weight:500;margin-bottom:6px;line-height:1.3}
.bc-meta{font-size:11px;color:var(--text2);display:flex;justify-content:space-between;align-items:center}

/* ── GANTT ── */
.gantt-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg)}
.gantt-inner{min-width:820px}
.gantt-head-row{display:grid;grid-template-columns:300px 1fr;font-size:11px;color:var(--text2);padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);font-weight:500;align-items:center;}
.gantt-row{display:grid;grid-template-columns:300px 1fr;align-items:center;padding:5px 14px;border-top:1px solid var(--border);font-size:12px;position:relative;cursor:pointer}
.gantt-row:hover{background:var(--bg2)!important}
.gantt-bar-cell{position:relative;height:14px;width:100%}
.gantt-bar{position:absolute;height:100%;border-radius:3px;z-index:1}
.gantt-today-line{position:absolute;top:0;width:2px;height:100%;background:rgba(216,90,48,.8);z-index:10;pointer-events:none}
.month-labels{display:flex;font-size:10px;color:var(--text3);height:100%;align-items:center;}
.month-col{flex:1;text-align:center;border-left:1px solid var(--border2);height:100%;display:flex;align-items:center;justify-content:center;font-weight:600;}
.month-col:first-child{border-left:none;}

/* ── MODALS ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px}
.modal{background:var(--bg);border-radius:var(--radius-lg);border:1px solid var(--border2);padding:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:14px}
.form-row{margin-bottom:12px}
.form-row label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;font-weight:500}
.form-row input,.form-row textarea,.form-row select{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.form-row textarea{resize:vertical;min-height:70px}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--green)}
.modal-actions{display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}

/* ── MISC ── */
.notice{background:var(--blue-light);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--text);margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.filter-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;background:var(--bg2);padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border)}
.filter-bar select{padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;background:var(--bg);color:var(--text);outline:none;min-width:180px}
.eval-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:10px}
.eval-card h4{font-size:13px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.eval-section h4{font-size:12px;color:var(--text2);margin-bottom:6px}
.stars-input{display:flex;gap:4px}
.star-btn{font-size:22px;cursor:pointer;color:var(--border2);transition:color .1s;background:none;border:none;padding:0;line-height:1}
.star-btn.on{color:var(--amber)}.star-btn.on-green{color:var(--green)}
.tag-active{background:var(--green-light);color:var(--green);font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.team-member{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.sub-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border)}
.sub-row:last-child{border-bottom:none}
.sub-row i.ti-circle, .sub-row i.ti-check {font-size:18px; cursor:pointer;}
.sub-row input[type="text"]{flex:1;background:var(--bg);border:1px solid var(--border2);padding:6px 8px;font-size:12px;border-radius:4px;color:var(--text);outline:none}
.sub-row input[type="date"]{width:115px;background:var(--bg);border:1px solid var(--border2);padding:6px;font-size:11px;border-radius:4px;color:var(--text);outline:none}
.dropdown{position:relative;display:inline-block}
.notif-badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:white;font-size:10px;font-weight:bold;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid var(--bg);z-index:10}
.dropdown-content{display:none;position:absolute;right:0;top:100%;margin-top:8px;width:280px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:9999;overflow:hidden}
.dropdown-content.show{display:block}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text);line-height:1.4}
.notif-item:last-child{border-bottom:none}
.notif-time{font-size:10px;color:var(--text3);margin-top:4px}

/* ── STAGE BUILDER ── */
.stage-builder{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:10px}
.stage-builder-head{background:var(--bg2);padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.stage-builder-body{padding:10px 12px}
.task-builder-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.task-builder-row input{flex:1;min-width:140px;padding:5px 8px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;background:var(--bg);color:var(--text);outline:none}
.task-builder-row select{padding:5px 6px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;background:var(--bg);color:var(--text);outline:none}
.week-pair{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.week-pair input[type=number]{width:52px;padding:5px 6px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;background:var(--bg);color:var(--text);outline:none;text-align:center}
.tip-box{background:var(--amber-light);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:12px;margin-bottom:14px;display:flex;gap:8px}
.import-area{border:2px dashed var(--border2);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;transition:border-color .15s}
.import-area:hover{border-color:var(--green)}
.import-area input{display:none}

/* ── THREE DOT MENU ── */
.proj-menu-btn{position:absolute;bottom:10px;right:10px;padding:4px 6px;font-size:16px;border:none;background:transparent;color:var(--text3);cursor:pointer;transition:color .15s;border-radius:var(--radius);line-height:1}
.proj-menu-btn:hover{color:var(--text);background:var(--bg2)}
.ctx-menu{position:absolute;right:10px;bottom:36px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:1000;min-width:180px;overflow:hidden}
.ctx-menu-item{padding:9px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text);transition:background .12s}
.ctx-menu-item:hover{background:var(--bg2)}
.ctx-menu-item.danger{color:var(--red)}
/* ── ARCHIVED BADGE ── */
.badge-archivado{background:var(--bg3);color:var(--text3)}
.badge-perdida{background:var(--red-light);color:var(--red)}
.badge-adjudicada{background:var(--green-light);color:var(--green)}
.badge-postulada{background:var(--purple-light);color:var(--purple)}
.archived-card{opacity:.55;filter:grayscale(.4)}
.archive-toggle-btn{margin-bottom:10px;font-size:12px}
/* ── SUBTASK PROGRESS IN CARD ── */
.subtask-progress-bar{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.subtask-progress-inner{height:100%;border-radius:2px;background:var(--green);transition:width .3s}
.subtask-pct-label{font-size:10px;color:var(--text3);margin-top:3px}
/* ── TEAM CALENDAR ── */
.team-cal-wrap{overflow-x:auto}
.cal-header-row{display:grid;font-size:11px;font-weight:600;background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 10px;color:var(--text2)}
.cal-task-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-top:1px solid var(--border);font-size:12px;cursor:pointer;transition:background .12s}
.cal-task-row:hover{background:var(--bg2)}
.member-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.filter-chip{padding:4px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border2);background:var(--bg);color:var(--text2);transition:all .15s}
.filter-chip.active{background:var(--green);border-color:var(--green);color:#fff}
.pill-status{font-size:10px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill-pendiente{background:var(--bg3);color:var(--text2)}
.pill-curso{background:var(--blue-light);color:var(--blue)}
.pill-retrasado{background:var(--red-light);color:var(--red)}
.pill-completado{background:var(--green-light);color:var(--green)}
/* ── PIPELINE STATUS BUTTONS ── */
.pipeline-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:600px){
  .topbar{flex-direction:column}
  .stats{grid-template-columns:1fr 1fr}
  .task-right{flex-wrap:wrap}
  .tab{padding:6px 10px;font-size:12px}
  .filter-bar select{flex:1;min-width:100%}
  .gantt-row {grid-template-columns: 240px 1fr;}
  .gantt-head-row {grid-template-columns: 240px 1fr;}
}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p style="color:var(--text2);font-weight:500">Conectando con la base de datos...</p>
</div>

<div id="screen-home" class="screen active">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon"><i class="ti ti-layout-dashboard"></i></div>
      <div>
        <h1>Mis Proyectos</h1>
        <p>Proyectos Jorge Paz</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="showTeamCalendar()"><i class="ti ti-calendar-stats"></i> Vista de equipo</button>

        <h1>Vista de Equipo</h1>
        <p>Actividades por persona y proyecto</p>
      </div>

<div id="modal-root"></div>

<script>
// ═══════════════════════════════════════════════════════
//  FIREBASE CONFIGURATION
// ═══════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyBmh1KNxCs7-eM8OSx6uHjxbIwwEgH_ju4",
  authDomain:        "proyectos-jpaz.firebaseapp.com",
  projectId:         "proyectos-jpaz",
  storageBucket:     "proyectos-jpaz.firebasestorage.app",
  messagingSenderId: "656956112515",
  appId:             "1:656956112515:web:bea06ac8c3df2b25a8e5b6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ═══════════════════════════════════════════════════════
//  CONSTANTES DE DISEÑO Y DATOS POR DEFECTO
// ═══════════════════════════════════════════════════════
const STAGE_PALETTE = [
  {color:'#1D9E75',light:'var(--green-light)'},
  {color:'#378ADD',light:'var(--blue-light)'},
  {color:'#D85A30',light:'var(--orange-light)'},
  {color:'#7F77DD',light:'var(--purple-light)'},
  {color:'#EF9F27',light:'var(--amber-light)'},
  {color:'#D4537E',light:'var(--red-light)'},
];

const DEFAULT_PAE_STAGES = [
  {id:1,name:'Etapa 1: Análisis bibliográfico',weeks:[1,13],tasks:[
    {id:'1-1',name:'Reunión de inicio con la contraparte técnica JUNAEB',week:1,type:'hito'},
    {id:'1-2',name:'Ajuste metodológico y elaboración de carta Gantt definitiva',weeks:[1,1],type:'tarea'},
    {id:'1-3',name:'Revisión de información administrativa y técnica sobre el PAE',weeks:[1,4],type:'tarea'},
    {id:'1-P1',name:'Producto N°1',week:5,type:'producto'},
    {id:'1-R1',name:'Revisión contraparte técnica',weeks:[5,7],type:'revision'}
  ]}
];

// ═══════════════════════════════════════════════════════
//  ESTADO GLOBAL
// ═══════════════════════════════════════════════════════
let allProjects   = {};        
let currentProjId = null;
let projListener  = null;     
let state         = {};       
let STAGES        = [];       
let currentTab    = 'tasks';
let filterAssignee = 'all';
let filterStatus   = 'all';
let unseenLogs     = 0;
let isFirstLoad    = true;
let hideCompletedGantt = false;

// ═══════════════════════════════════════════════════════
//  BOOTSTRAP: cargar lista de proyectos
// ═══════════════════════════════════════════════════════
async function loadProjectList() {
  try {
    const snap = await db.collection('projects').get();
    allProjects = {};
    
    // MIGRACIÓN AUTOMÁTICA
    if (snap.empty) {
        try {
            const oldDoc = await db.collection('gantt').doc('pae_state_v1').get();
            if (oldDoc.exists) {
                await migrateOldData(oldDoc.data());
                return; 
            }
        } catch(e) {}
    }

    snap.forEach(doc => { allProjects[doc.id] = { meta: doc.data() }; });
    renderHome();
  } catch(e) {
    console.error('Error cargando proyectos:', e);
  } finally {
    document.getElementById('loading-overlay').style.display = 'none';
  }
}

async function migrateOldData(oldState) {
    const meta = {
        name: "Medición del desperdicio de alimentos · PAE",
        client: "JUNAEB",
        startDate: oldState.startDate || "2026-06-01",
        totalWeeks: 35,
        type: "proyecto",
        stages: DEFAULT_PAE_STAGES, 
        accentColor: "#1D9E75",
        createdAt: Date.now(),
        lastPct: 0
    };
    try {
        const ref = await db.collection('projects').add(meta);
        await db.collection('projects').doc(ref.id).collection('runtime').doc('state').set(oldState);
        loadProjectList(); 
    } catch(e) {}
}

// ═══════════════════════════════════════════════════════
//  HOME SCREEN
// ═══════════════════════════════════════════════════════
let showArchived = false;
function renderHome() {
  const ids = Object.keys(allProjects);
  const el  = document.getElementById('home-projects-list');

  if (ids.length === 0) {
    el.innerHTML = `
      <p style="font-size:13px;color:var(--text2);margin-bottom:20px">Aún no tienes proyectos. Crea el primero.</p>
      <div class="projects-grid">
        <div class="new-card" onclick="openNewProjectModal()">
          <i class="ti ti-plus"></i><span>Nuevo proyecto o propuesta</span>
        </div>
      </div>`;
    return;
  }

  const proyectos  = ids.filter(id => allProjects[id].meta.type === 'proyecto' && !allProjects[id].meta.archived);
  const propuestas = ids.filter(id => allProjects[id].meta.type === 'propuesta' && !allProjects[id].meta.archived);
  const archivados = ids.filter(id => allProjects[id].meta.archived);
  let html = '';

  if (proyectos.length > 0) {
    html += `<div class="section-label"><i class="ti ti-briefcase"></i> Proyectos activos</div><div class="projects-grid">`;
    proyectos.forEach(id => { html += buildProjectCard(id); });
    html += `</div>`;
  }

  if (propuestas.length > 0) {
    html += `<div class="section-label" style="margin-top:8px"><i class="ti ti-file-description"></i> Propuestas técnicas</div><div class="projects-grid">`;
    propuestas.forEach(id => { html += buildProjectCard(id); });
    html += `</div>`;
  }

  html += `<div class="projects-grid"><div class="new-card" onclick="openNewProjectModal()"><i class="ti ti-plus"></i><span>Nuevo proyecto o propuesta</span></div></div>`;

  if (archivados.length > 0) {
    html += `<div style="margin-top:16px">
      <button class="btn archive-toggle-btn" onclick="showArchived=!showArchived;renderHome()">
        <i class="ti ti-archive"></i> Ver proyectos archivados (${archivados.length})
      </button>
      ${showArchived ? `<div class="projects-grid">` + archivados.map(id => buildProjectCard(id, true)).join('') + `</div>` : ''}
    </div>`;
  }

  el.innerHTML = html;
}

function buildProjectCard(id, isArch=false) {
  const m  = allProjects[id].meta;
  const pal = STAGE_PALETTE[0];
  const pct = m.lastPct || 0;
  let typeBadgeClass = 'badge-proyecto';
  let typeBadgeLabel = 'Proyecto';
  if (m.type === 'propuesta') {
    if (m.pipelineStatus === 'postulada')    { typeBadgeClass='badge-postulada'; typeBadgeLabel='Postulada'; }
    else if (m.pipelineStatus === 'adjudicada') { typeBadgeClass='badge-adjudicada'; typeBadgeLabel='Adjudicada'; }
    else if (m.pipelineStatus === 'perdida')  { typeBadgeClass='badge-perdida'; typeBadgeLabel='Perdida'; }
    else { typeBadgeClass='badge-propuesta'; typeBadgeLabel='Propuesta'; }
  }
  if (m.archived && m.archivedReason === 'finalizado') { typeBadgeClass='badge-archivado'; typeBadgeLabel='Finalizado'; }
  else if (m.archived) { typeBadgeClass='badge-archivado'; typeBadgeLabel='Archivado'; }
  
  const typeBadge = `<span class="pc-type-badge ${typeBadgeClass}">${typeBadgeLabel}</span>`;
  return `
    <div class="project-card${isArch?' archived-card':''}" onclick="openProject('${id}')">
      <div class="pc-accent" style="background:${m.accentColor||pal.color}"></div>
      ${typeBadge}
      <div class="pc-title">${m.name}</div>
      <div class="pc-client">${m.client||'Sin cliente'}</div>
      <div class="pc-meta">
        <span><i class="ti ti-calendar"></i> ${m.startDate||'—'}</span>
        <span><i class="ti ti-clock"></i> ${m.totalWeeks||0} semanas</span>
        <span><i class="ti ti-chart-pie"></i> ${pct}%</span>
      </div>
      <div class="pc-pbar"><div class="pc-pbar-inner" style="width:${pct}%;background:${m.accentColor||pal.color}"></div></div>
      <button class="proj-menu-btn" title="Opciones" onclick="event.stopPropagation(); toggleProjMenu('${id}',this)"><i class="ti ti-dots-vertical"></i></button>
    </div>`;
}

function toggleProjMenu(id, btn) {
  // remove any open menu
  document.querySelectorAll('.ctx-menu').forEach(m => m.remove());
  const m = allProjects[id].meta;
  const isProp = m.type === 'propuesta';
  let items = `<div class="ctx-menu-item" onclick="event.stopPropagation();closeCtxMenu();openEditProjectModal('${id}')"><i class="ti ti-edit"></i> Editar proyecto</div>`;
  if (!m.archived) {
    if (isProp) {
      items += `<div class="ctx-menu-item" onclick="event.stopPropagation();closeCtxMenu();setPipelineStatus('${id}','postulada')"><i class="ti ti-send"></i> Marcar como Postulada</div>
      <div class="ctx-menu-item" onclick="event.stopPropagation();closeCtxMenu();setPipelineStatus('${id}','adjudicada')"><i class="ti ti-trophy"></i> Adjudicada → Crear proyecto</div>
      <div class="ctx-menu-item" onclick="event.stopPropagation();closeCtxMenu();setPipelineStatus('${id}','perdida')"><i class="ti ti-x"></i> Perdida → Archivar</div>`;
    }
    items += `<div class="ctx-menu-item" onclick="event.stopPropagation();closeCtxMenu();archiveProject('${id}','finalizado')"><i class="ti ti-check-circle"></i> Proyecto finalizado</div>`;
    items += `<div class="ctx-menu-item danger" onclick="event.stopPropagation();closeCtxMenu();deleteProject('${id}')"><i class="ti ti-trash"></i> Eliminar proyecto</div>`;
  } else {
    items += `<div class="ctx-menu-item" onclick="event.stopPropagation();closeCtxMenu();unarchiveProject('${id}')"><i class="ti ti-archive-off"></i> Desarchivar</div>`;
    items += `<div class="ctx-menu-item danger" onclick="event.stopPropagation();closeCtxMenu();deleteProject('${id}')"><i class="ti ti-trash"></i> Eliminar proyecto</div>`;
  }
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.innerHTML = items;
  btn.closest('.project-card').appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeCtxMenu, {once:true}), 50);
}
function closeCtxMenu() { document.querySelectorAll('.ctx-menu').forEach(m=>m.remove()); }

async function archiveProject(id, reason='archivado') {
  try {
    await db.collection('projects').doc(id).update({ archived:true, archivedReason: reason });
    allProjects[id].meta.archived = true;
    allProjects[id].meta.archivedReason = reason;
    renderHome();
  } catch(e) { alert('Error al archivar.'); }
}
async function unarchiveProject(id) {
  try {
    await db.collection('projects').doc(id).update({ archived:false, archivedReason:'' });
    allProjects[id].meta.archived = false;
    allProjects[id].meta.archivedReason = '';
    renderHome();
  } catch(e) { alert('Error al desarchivar.'); }
}
async function setPipelineStatus(id, status) {
  try {
    if (status === 'adjudicada') {
      if (!confirm('¿Adjudicada? Se creará un nuevo proyecto a partir de esta propuesta.')) return;
      // Convert propuesta to proyecto
      await db.collection('projects').doc(id).update({ pipelineStatus:'adjudicada', type:'proyecto' });
      allProjects[id].meta.pipelineStatus = 'adjudicada';
      allProjects[id].meta.type = 'proyecto';
    } else if (status === 'perdida') {
      await db.collection('projects').doc(id).update({ pipelineStatus:'perdida', archived:true, archivedReason:'perdida' });
      allProjects[id].meta.pipelineStatus = 'perdida';
      allProjects[id].meta.archived = true;
      allProjects[id].meta.archivedReason = 'perdida';
    } else {
      await db.collection('projects').doc(id).update({ pipelineStatus: status });
      allProjects[id].meta.pipelineStatus = status;
    }
    renderHome();
  } catch(e) { alert('Error al actualizar estado.'); }
}

function openEditProjectModal(id) {
  const m = allProjects[id].meta;
  modal(`<h3><i class="ti ti-edit" style="color:var(--blue)"></i> Editar proyecto</h3>
    <div class="form-row"><label>Nombre</label><input id="ep-name" type="text" value="${m.name||''}"/></div>
    <div class="form-row"><label>Cliente / Mandante</label><input id="ep-client" type="text" value="${m.client||''}"/></div>
    ${m.type==='propuesta'?`
    <div class="form-row"><label>ID Licitación</label><input id="ep-licit" type="text" value="${m.licitacionId||''}"/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-row"><label>Fecha de cierre</label><input id="ep-close" type="date" value="${m.fechaCierre||''}"/></div>
      <div class="form-row"><label>Fecha adjudicación</label><input id="ep-adj" type="date" value="${m.fechaAdjudicacion||''}"/></div>
    </div>`:''}
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveEditProject('${id}')"><i class="ti ti-check"></i> Guardar</button></div>`);
}
async function saveEditProject(id) {
  const m = allProjects[id].meta;
  const upd = {
    name: document.getElementById('ep-name').value.trim()||m.name,
    client: document.getElementById('ep-client').value.trim()
  };
  if (m.type==='propuesta') {
    const li = document.getElementById('ep-licit'); if(li) upd.licitacionId=li.value;
    const cl = document.getElementById('ep-close'); if(cl) upd.fechaCierre=cl.value;
    const aj = document.getElementById('ep-adj');   if(aj) upd.fechaAdjudicacion=aj.value;
  }
  try {
    await db.collection('projects').doc(id).update(upd);
    Object.assign(allProjects[id].meta, upd);
    closeModal(); renderHome();
  } catch(e) { alert('Error al guardar.'); }
}

// ═══════════════════════════════════════════════════════
//  NAVEGACIÓN
// ═══════════════════════════════════════════════════════
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

function goHome() {
  if (projListener) { projListener(); projListener = null; }
  currentProjId = null; state = {}; STAGES = [];
  filterAssignee = 'all'; filterStatus = 'all';
  currentTab = 'tasks'; unseenLogs = 0; isFirstLoad = true; hideCompletedGantt = false;
  showScreen('home');
  loadProjectList();
}

// ═══════════════════════════════════════════════════════
//  ABRIR PROYECTO
// ═══════════════════════════════════════════════════════
function openProject(id) {
  currentProjId = id;
  const meta = allProjects[id].meta;
  isFirstLoad  = true;
  unseenLogs   = 0;

  STAGES = (meta.stages || []).map((s, i) => ({
    ...s,
    color: STAGE_PALETTE[i % STAGE_PALETTE.length].color,
    light: STAGE_PALETTE[i % STAGE_PALETTE.length].light,
  }));

  document.getElementById('proj-title').textContent    = meta.name;
  document.getElementById('proj-subtitle').textContent = `${meta.client||'Sin cliente'} · Inicio: ${fmtDateStr(meta.startDate)} · ${meta.totalWeeks} semanas · ${STAGES.length} etapas`;
  setTab('tasks', document.querySelector('.tab'));
  showScreen('project');

  const stateRef = db.collection('projects').doc(id).collection('runtime').doc('state');
  if (projListener) projListener();
  projListener = stateRef.onSnapshot(doc => {
    if (doc.exists) {
      const oldLen = state.logs ? state.logs.length : 0;
      state = doc.data();
      ensureStateFallbacks(meta.startDate);
      if (state.logs.length > oldLen && !isFirstLoad) {
        unseenLogs += (state.logs.length - oldLen);
        updateNotifBadge();
      }
    } else {
      state = buildDefaultState(meta.startDate);
      saveState();
    }
    isFirstLoad = false;
    autoUpdateDelays();
    renderAllViews();
    renderNotifs();
    
    const s = calcStats();
    if ((meta.lastPct||0) !== s.pct) {
      db.collection('projects').doc(id).update({ lastPct: s.pct });
      allProjects[id].meta.lastPct = s.pct;
    }
  });
}

function buildDefaultState(startDate) {
  return {
    startDate: startDate || '',
    statuses: {}, evaluations: {}, evaluationsClient: {},
    notes: {}, collapsed: {}, ganttCollapsed: {},
    taskOverrides: {}, customTasks: [], deletedIds: [],
    subtasks: {}, logs: [], team: []
  };
}

function ensureStateFallbacks(startDate) {
  if (!state.statuses)         state.statuses = {};
  if (!state.evaluations)      state.evaluations = {};
  if (!state.evaluationsClient)state.evaluationsClient = {};
  if (!state.notes)            state.notes = {};
  if (!state.collapsed)        state.collapsed = {};
  if (!state.ganttCollapsed)   state.ganttCollapsed = {};
  if (!state.taskOverrides)    state.taskOverrides = {};
  if (!state.customTasks)      state.customTasks = [];
  if (!state.deletedIds)       state.deletedIds = [];
  if (!state.subtasks)         state.subtasks = {};
  if (!state.logs)             state.logs = [];
  if (!state.team)             state.team = [];
  if (!state.startDate)        state.startDate = startDate || '';
}

function saveState() {
  if(!currentProjId) return;
  const stateRef = db.collection('projects').doc(currentProjId).collection('runtime').doc('state');
  stateRef.set(state).catch(e => console.error('Error guardando:', e));
}

function logAction(text) {
  if (!state.logs) state.logs = [];
  state.logs.unshift({ text, time: Date.now() });
  if (state.logs.length > 50) state.logs = state.logs.slice(0, 50);
  saveState();
}

async function deleteProject(id) {
  if (!confirm(`¿Eliminar el proyecto "${allProjects[id].meta.name}" permanentemente? Esta acción no se puede deshacer.`)) return;
  try {
    await db.collection('projects').doc(id).collection('runtime').doc('state').delete();
    await db.collection('projects').doc(id).delete();
    delete allProjects[id];
    renderHome();
  } catch(e) { alert('Error al eliminar el proyecto.'); }
}

// ═══════════════════════════════════════════════════════
//  CREAR NUEVO PROYECTO (modal)
// ═══════════════════════════════════════════════════════
function openNewProjectModal() {
  modal(`
    <h3><i class="ti ti-plus" style="color:var(--green)"></i> Nuevo proyecto o propuesta</h3>
    <div class="form-row">
      <label>Tipo</label>
      <select id="np-type" onchange="togglePropFields()">
        <option value="proyecto">Proyecto</option>
        <option value="propuesta">Propuesta técnica</option>
      </select>
    </div>
    <div class="form-row">
      <label>Nombre del proyecto</label>
      <input id="np-name" type="text" placeholder="Ej: Evaluación de Programas Sociales"/>
    </div>
    <div class="form-row">
      <label>Cliente / Mandante</label>
      <input id="np-client" type="text" placeholder="Ej: MINSAL"/>
    </div>
    <div id="np-prop-fields" style="display:none">
      <div class="form-row"><label>ID Licitación</label><input id="np-licit" type="text" placeholder="Ej: 2024-001"/></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-row"><label>Fecha de cierre</label><input id="np-close" type="date"/></div>
        <div class="form-row"><label>Fecha adjudicación</label><input id="np-adj" type="date"/></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-row">
        <label>Fecha inicio (Semana 1)</label>
        <input id="np-start" type="date" value="${toYMD(new Date())}"/>
      </div>
      <div class="form-row">
        <label>Total de semanas</label>
        <input id="np-weeks" type="number" min="1" max="104" value="20"/>
      </div>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:12px 0"/>
    <p style="font-size:13px;font-weight:500;margin-bottom:10px">Importar etapas y tareas desde Excel</p>

function handleXlsxFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      // Parse CSV/XLSX using simple approach
      const text = ev.target.result;
      let rows = [];
      
      // Try to detect if it's CSV or binary XLSX
      if (typeof text === 'string') {
        // CSV parsing
        rows = text.trim().split('\n').map(r => r.split(',').map(c => c.replace(/^"|"$/g,'').trim()));
      }
      
      if (rows.length < 2) { document.getElementById('xlsx-preview').innerHTML='<p style="color:var(--red);font-size:12px">No se pudo leer el archivo.</p>'; return; }
      
      const header = rows[0].map(h => h.toLowerCase().trim());
      const etapaIdx = header.findIndex(h=>h.includes('etapa'));
      const nameIdx  = header.findIndex(h=>h.includes('actividad')||h.includes('nombre'));
      const typeIdx  = header.findIndex(h=>h.includes('tipo'));
      const assgIdx  = header.findIndex(h=>h.includes('responsable'));
      const sdIdx    = header.findIndex(h=>h.includes('inicio'));
      const edIdx    = header.findIndex(h=>h.includes('fin'));
      
      const stagesMap = {};
      const stagesOrder = [];
      rows.slice(1).forEach((r,ri) => {
        if (r.length < 2) return;
        const etapa = r[etapaIdx>=0?etapaIdx:0]||`Etapa 1`;
        const name  = r[nameIdx>=0?nameIdx:1]||'';
        if (!name) return;
        if (!stagesMap[etapa]) { stagesMap[etapa]=[]; stagesOrder.push(etapa); }
        stagesMap[etapa].push({
          id: `xl-${ri}`,
          name,
          type: typeIdx>=0?(r[typeIdx]||'tarea'):'tarea',
          assignee: assgIdx>=0?(r[assgIdx]||''):'',
          startDate: sdIdx>=0?(r[sdIdx]||''):'',
          endDate:   edIdx>=0?(r[edIdx]||''):'',
        });
      });
      
      parsedXlsxStages = stagesOrder.map((name,i) => {
        const tasks = stagesMap[name];
        const dates = tasks.map(t=>t.startDate).filter(Boolean).map(d=>new Date(d)).filter(d=>!isNaN(d));
        return { id: i+1, name, tasks, _rawName: name };
      });
      
      const prev = document.getElementById('xlsx-preview');
      prev.innerHTML = `<div style="background:var(--green-light);border:1px solid var(--green);border-radius:var(--radius);padding:10px 14px;font-size:12px">
        <b style="color:var(--green)"><i class="ti ti-check"></i> Archivo cargado correctamente</b><br/>
        ${parsedXlsxStages.length} etapas · ${parsedXlsxStages.reduce((a,s)=>a+s.tasks.length,0)} actividades
        <ul style="margin-top:8px;padding-left:16px;color:var(--text2)">
          ${parsedXlsxStages.map(s=>`<li>${s.name} (${s.tasks.length} tareas)</li>`).join('')}
        </ul>
      </div>`;
    } catch(err) {
      document.getElementById('xlsx-preview').innerHTML=`<p style="color:var(--red);font-size:12px">Error al procesar el archivo: ${err.message}</p>`;
    }
  };
  reader.readAsText(file);
}

function collectStagesFromForm() {
  const stageEls = document.querySelectorAll('#stages-container .stage-builder');
  const stages = [];
  stageEls.forEach((el, si) => {
    const sn = el.id.replace('stage-','');
    const name = document.getElementById('stage-name-'+sn).value.trim() || `Etapa ${si+1}`;
    const taskEls = document.querySelectorAll(`#tasks-of-${sn} .task-builder-row`);
    const tasks = [];
    taskEls.forEach((tel, ti) => {
      const tid = tel.id;
      const tname = document.getElementById(tid+'-name').value.trim();
      if (!tname) return;
      const type = document.getElementById(tid+'-type').value;
      const ws   = parseInt(document.getElementById(tid+'-ws').value)||1;
      const we   = parseInt(document.getElementById(tid+'-we').value)||ws;
      const id   = `${si+1}-${ti+1}`;
      const task = { id, name: tname, type };
      if (type === 'hito') { task.week = ws; }
      else { task.weeks = [ws, we]; }
      tasks.push(task);
    });
    const allWeeks = tasks.flatMap(t => t.weeks||[t.week]);
    const minW = allWeeks.length ? Math.min(...allWeeks) : 1;
    const maxW = allWeeks.length ? Math.max(...allWeeks) : 1;
    stages.push({ id: si+1, name, weeks: [minW, maxW], tasks });
  });
  return stages;
}

async function saveNewProject() {
  const name   = document.getElementById('np-name').value.trim();
  const client = document.getElementById('np-client').value.trim();
  const start  = document.getElementById('np-start').value;
  const weeks  = parseInt(document.getElementById('np-weeks').value)||10;
  const type   = document.getElementById('np-type').value;
  if (!name) { alert('El nombre del proyecto es obligatorio.'); return; }

  let stages = [];
  if (parsedXlsxStages && parsedXlsxStages.length > 0) {
    // Convert parsed xlsx stages to proper format
    stages = parsedXlsxStages.map((s, si) => {
      const tasks = s.tasks.map((t, ti) => {
        const task = { ...t, id: `${si+1}-${ti+1}` };
        // Convert dates to week numbers if start date provided
        if (start && task.startDate) {
          const projStart = parseLocal(start);
          const taskStart = parseLocal(task.startDate);
          const taskEnd   = task.endDate ? parseLocal(task.endDate) : taskStart;
          if (!isNaN(taskStart) && !isNaN(projStart)) {
            const ws = Math.max(1, Math.floor((taskStart - projStart)/(7*24*3600*1000))+1);
            const we = Math.max(ws, Math.floor((taskEnd - projStart)/(7*24*3600*1000))+1);
            if (task.type === 'hito') { task.week = ws; }
            else { task.weeks = [ws, we]; }
          }
        } else if (!task.weeks && !task.week) { task.weeks=[1,1]; }
        return task;
      });
      // Calculate stage weeks span
      const allWeeks = tasks.flatMap(t=>t.weeks||[t.week||1]);
      return { id: si+1, name: s.name, weeks:[Math.min(...allWeeks)||1, Math.max(...allWeeks)||1], tasks };
    });
  }

  const pal = STAGE_PALETTE[0];
  const meta = {
    name, client, startDate: start, totalWeeks: weeks,
    type, stages, accentColor: pal.color,
    createdAt: Date.now(), lastPct: 0
  };
  
  if (type === 'propuesta') {
    const li = document.getElementById('np-licit'); if(li&&li.value) meta.licitacionId=li.value;
    const cl = document.getElementById('np-close'); if(cl&&cl.value) meta.fechaCierre=cl.value;
    const aj = document.getElementById('np-adj');   if(aj&&aj.value) meta.fechaAdjudicacion=aj.value;
    meta.pipelineStatus = 'borrador';
  }

  try {
    const ref = await db.collection('projects').add(meta);
    allProjects[ref.id] = { meta };
    parsedXlsxStages = null;
    closeModal();
    openProject(ref.id);
  } catch(e) { console.error(e); alert('Error al guardar el proyecto en Firebase.'); }
}
// ═══════════════════════════════════════════════════════
//  UTILS FECHAS
// ═══════════════════════════════════════════════════════
function parseLocal(ds) {
  if (!ds) return new Date();
  const parts = ds.split('T')[0].split('-');
  if (parts.length < 3) return new Date();
  return new Date(parts[0], parts[1]-1, parts[2]);
}
function toYMD(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateStr(s) {
  if (!s) return '—';
  return parseLocal(s).toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'});
}
function getStartDate() { return parseLocal(state.startDate); }
function weekStart(w) { const d=new Date(getStartDate()); d.setDate(d.getDate()+(w-1)*7); return d; }
function weekEnd(w)   { const d=weekStart(w); d.setDate(d.getDate()+6); return d; }
function fmtDate(d)   { return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtShort(d)  { return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short'}); }

function getRelWeek(dateInput) {
    const d = (typeof dateInput === 'string') ? parseLocal(dateInput) : dateInput;
    if (isNaN(d)) return '?';
    const start = getStartDate();
    if (isNaN(start)) return '?';
    const startNoTime = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const dNoTime = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diff = (dNoTime - startNoTime) / (7 * 24 * 3600 * 1000);
    return Math.max(1, Math.floor(diff) + 1);
}

function timeAgo(ms)  {
  const mins = Math.floor((Date.now()-ms)/60000);
  if (mins < 1) return 'Hace un momento';
  if (mins < 60) return `Hace ${mins} min`;
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return `Hace ${hrs} h`;
  return `Hace ${Math.floor(hrs/24)} días`;
}
function weekLabel(t) {
  if (t.weeks) return `S${t.weeks[0]}–S${t.weeks[1]} · ${fmtShort(weekStart(t.weeks[0]))} — ${fmtShort(weekEnd(t.weeks[1]))}`;
  if (t.week)  return `S${t.week} · ${fmtShort(weekStart(t.week))} — ${fmtShort(weekEnd(t.week))}`;
  return '';
}
function currentWeek() {
  const now=new Date(); const start=getStartDate();
  if(isNaN(start)) return 1;
  const diff=Math.floor((now-start)/(7*24*3600*1000));
  const meta = currentProjId ? allProjects[currentProjId].meta : null;
  const tw   = meta ? (meta.totalWeeks||35) : 35;
  return Math.max(1, Math.min(tw+1, diff+1));
}
function todayFraction() {
  const meta = currentProjId ? allProjects[currentProjId].meta : null;
  const tw   = meta ? (meta.totalWeeks||35) : 35;
  const now=new Date(); const start=getStartDate();
  if(isNaN(start)) return 0;
  return Math.max(0, Math.min(1, (now-start)/(tw*7*24*3600*1000)));
}
function getTaskDates(t) {
  try {
      const s = t.startDate ? parseLocal(t.startDate) : weekStart(t.weeks ? t.weeks[0] : (t.week||1));
      const e = t.endDate   ? parseLocal(t.endDate)   : weekEnd(t.weeks ? t.weeks[1] : (t.week||1));
      return { start: s, end: e };
  } catch(e) { return { start: new Date(), end: new Date() }; }
}
function getTaskStatus(id) { return state.statuses[id] || 'pendiente'; }

function getAllTasks() {
  const all = [];
  STAGES.forEach(s => s.tasks.forEach(t => {
    if (state.deletedIds && state.deletedIds.includes(t.id)) return;
    const ov = state.taskOverrides && state.taskOverrides[t.id];
    all.push({ ...t, stageId: s.id, stageColor: s.color, stageLight: s.light, ...(ov||{}) });
  }));
  (state.customTasks||[]).forEach(t => {
    if (state.deletedIds && state.deletedIds.includes(t.id)) return;
    const ov = state.taskOverrides && state.taskOverrides[t.id];
    all.push({ ...t, ...(ov||{}) });
  });
  return all;
}

function autoUpdateDelays() {
  let changed = false;
  const today = new Date(); today.setHours(0,0,0,0);
  getAllTasks().forEach(t => {
    const st = getTaskStatus(t.id);
    if (st === 'pendiente' || st === 'curso') {
      const { end } = getTaskDates(t);
      if(!isNaN(end)) {
          const endNoTime = new Date(end); endNoTime.setHours(0,0,0,0);
          if (endNoTime < today) { state.statuses[t.id] = 'retrasado'; changed = true; }
      }
    }
  });
  if (changed) saveState();
}

function calcStats() {
  const all = getAllTasks();
  const counts = { pendiente:0, curso:0, retrasado:0, completado:0 };
  all.forEach(t => counts[getTaskStatus(t.id)]++);
  const products    = all.filter(t => t.type==='producto');
  const productsDone= products.filter(t => getTaskStatus(t.id)==='completado').length;
  return {
    total: all.length, done: counts.completado, counts,
    products: products.length, productsDone,
    pct: all.length ? Math.round(counts.completado/all.length*100) : 0
  };
}

        <option value="active"    ${filterStatus==='active'?'selected':''}>Pendientes y En curso</option>
        <option value="retrasado" ${filterStatus==='retrasado'?'selected':''}>Retrasados</option>
        <option value="completado"${filterStatus==='completado'?'selected':''}>Completados</option>
      </select>
    </div>`;

    STAGES.forEach(stage => {
      let fTasks = getAllTasks().filter(t => t.stageId===stage.id).filter(t => {
        let matchA = true;
        if (filterAssignee==='unassigned') matchA = !t.assignee;
        else if (filterAssignee!=='all')   matchA = t.assignee===filterAssignee;
        const st = getTaskStatus(t.id);
        let matchS = (filterStatus==='all')||
          (filterStatus==='active'&&(st==='pendiente'||st==='curso'))||
          (filterStatus===st);
        return matchA && matchS;
      }).sort((a,b) => getTaskDates(a).start - getTaskDates(b).start);
      if (fTasks.length===0) return;

      const done = fTasks.filter(t=>getTaskStatus(t.id)==='completado').length;
      const pct  = fTasks.length ? Math.round(done/fTasks.length*100) : 0;
      const col  = state.collapsed && state.collapsed[stage.id];
      html += `<div class="section">
        <div class="section-header" onclick="toggleSection(${stage.id})">
          <div class="section-title">
            <span style="width:10px;height:10px;border-radius:50%;background:${stage.color};display:inline-block;flex-shrink:0"></span>
            ${stage.name}
          </div>
          <div class="section-meta">
            <span>${done}/${fTasks.length}</span>
            <div class="pbar-sm"><div class="pbar-sm-inner" style="width:${pct}%;background:${stage.color}"></div></div>
            <i class="ti ti-chevron-${col?'right':'down'}" style="font-size:14px"></i>
          </div>
        </div>
        ${col ? '' : renderTaskList(fTasks, stage)}
      </div>`;
    });
    el.innerHTML = html;
  } catch(e) { console.error(e); }
}

function renderTaskList(tasks, stage) {
  let html = '<div>';
  tasks.forEach(t => {
    const status = getTaskStatus(t.id);
    const { start, end } = getTaskDates(t);
    const dateLabel = `${fmtShort(start)} — ${fmtShort(end)} · S${getRelWeek(start)}-S${getRelWeek(end)}`;
    
    const assigneeBadge = (t.assignee && typeof t.assignee==='string')
      ? `<span class="badge" style="background:var(--bg3);color:var(--text2)"><i class="ti ti-user"></i> ${t.assignee}</span>` : '';
    const subs = state.subtasks && state.subtasks[t.id] ? state.subtasks[t.id] : [];
    const subsTotal = subs.length;
    const subsDoneC = subs.filter(s=>s.status==='completado').length;
    const subsPctC  = subsTotal > 0 ? Math.round(subsDoneC/subsTotal*100) : -1;
    const subtaskBar = subsPctC >= 0
      ? `<div class="subtask-progress-bar"><div class="subtask-progress-inner" style="width:${subsPctC}%"></div></div><div class="subtask-pct-label">${subsDoneC}/${subsTotal} subtareas</div>`
      : '';
    html += `<div class="task-row${status==='completado'?' done':''}" onclick="openTask('${t.id}',${stage.id})">
      <div class="status-icon si-${status}" onclick="quickToggle(event,'${t.id}')">${getStatusIconHTML(status)}</div>
      <div class="task-info">
        <div class="task-name">${t.name}</div>
        <div class="task-date"><i class="ti ti-calendar-event" style="font-size:11px"></i> ${dateLabel}</div>
        ${subtaskBar}
      </div>
      <div class="task-right">${assigneeBadge}${badge(t.type)}</div>
    </div>`;
    
    const subs = state.subtasks && state.subtasks[t.id] ? state.subtasks[t.id] : [];
    subs.forEach(s => {
      if (!s) return;
      const sst   = s.status||'pendiente';
      const sassg = (s.assignee&&typeof s.assignee==='string') ? ` <i class="ti ti-user"></i> ${s.assignee.split(' ')[0]}` : '';
      const sdate = s.date ? ` · <i class="ti ti-calendar-event"></i> ${fmtShort(parseLocal(s.date))}` : '';
      html += `<div class="subtask-indented ${sst==='completado'?'done':''}" onclick="openTask('${t.id}',${stage.id})">
        <i class="ti ti-${sst==='completado'?'check':'circle'}" style="color:${sst==='completado'?'var(--green)':'var(--border2)'}; font-size:16px;"></i>
        <span class="st-name">${s.name}<span style="font-size:11px;color:var(--text3)"> ${sassg}${sdate}</span></span>
      </div>`;
    });
  });
  html += `<div class="add-task-btn" onclick="openAddTask(${stage.id})"><i class="ti ti-plus"></i> Agregar actividad</div>`;
  html += '</div>';
  return html;
}

function toggleSection(id) {
  if (!state.collapsed) state.collapsed = {};
  state.collapsed[id] = !state.collapsed[id];
  saveState();
}
function quickToggle(e, id) {
  e.stopPropagation();
  const curr  = getTaskStatus(id);
  const isDone= curr==='completado';
  state.statuses[id] = isDone ? 'pendiente' : 'completado';
  const tName = (getAllTasks().find(t=>t.id===id)||{}).name||'';
  logAction(`Marcó '${tName.length>25?tName.slice(0,25)+'...':tName}' como ${isDone?'Pendiente':'Completado'}.`);
  saveState();
}

function toggleGanttCompleted() {
    hideCompletedGantt = !hideCompletedGantt;
    renderGantt();
}

function renderGantt() {
  const el = document.getElementById('tab-gantt');
  if (!el) return;
  try {
    const meta      = currentProjId ? allProjects[currentProjId].meta : {};
    const TOTAL_W   = meta.totalWeeks || 35;
    const TOTAL_D   = TOTAL_W * 7;
    const projStart = getStartDate();
    const tf        = todayFraction();
    
    let monthsHtml = '';
    let currentM = '';
    let wCount = 0;
    
    for (let w = 1; w <= TOTAL_W; w++) {
        const date = weekStart(w);
        const mStr = date.toLocaleDateString('es-CL', { month: 'short', year: '2-digit' }).replace(' de ', ' '); 
        if (mStr !== currentM) {
            if (wCount > 0) monthsHtml += `<div class="month-col" style="flex:${wCount};">${currentM}</div>`;
            currentM = mStr;
            wCount = 1;
        } else {
            wCount++;
        }
    }
    if (wCount > 0) monthsHtml += `<div class="month-col" style="flex:${wCount};">${currentM}</div>`;

    let html = `<div class="gantt-wrap"><div class="gantt-inner">
      <div class="gantt-head-row">
        <div style="display:flex; align-items:center; justify-content:space-between; padding-right:10px;">
          Actividad 
          <label style="font-weight:normal; cursor:pointer; font-size:10px; display:flex; align-items:center; gap:4px; color:var(--text2)">
            <input type="checkbox" onchange="toggleGanttCompleted()" ${hideCompletedGantt?'checked':''}> Ocultar completadas
          </label>
        </div>
        <div class="month-labels">${monthsHtml}</div>
      </div>`;

    STAGES.forEach(stage => {
      let stageTasks = getAllTasks().filter(t=>t.stageId===stage.id);
      if(hideCompletedGantt) stageTasks = stageTasks.filter(t => getTaskStatus(t.id) !== 'completado');
      stageTasks = stageTasks.sort((a,b)=>getTaskDates(a).start-getTaskDates(b).start);
      
      if (!stageTasks.length) return;
      const scol = state.ganttCollapsed && state.ganttCollapsed[stage.id];
      
      let stageBarHtml = `<div></div>`;
      if(stageTasks.length > 0) {
          let minS = Infinity, maxE = -Infinity;
          stageTasks.forEach(t => {
              const {start, end} = getTaskDates(t);
              if(start && !isNaN(start) && start.getTime() < minS) minS = start.getTime();
              if(end && !isNaN(end) && end.getTime() > maxE) maxE = end.getTime();
          });
          if(minS !== Infinity && maxE !== -Infinity) {
              const sD = Math.floor((minS - projStart.getTime())/(24*3600*1000));
              const eD = Math.floor((maxE - projStart.getTime())/(24*3600*1000));
              const sLeft = Math.max(0, (sD/TOTAL_D)*100);
              const sWidth = Math.max(0.5, ((eD - sD + 1)/TOTAL_D)*100);
              stageBarHtml = `<div class="gantt-bar-cell"><div class="gantt-bar" style="left:${sLeft}%;width:${sWidth}%;background:${stage.color};opacity:0.25;border-radius:4px"></div></div>`;
          }
      }

      html += `<div class="gantt-row" style="background:${stage.light}; cursor:pointer" onclick="toggleGanttSection(${stage.id})">
        <div style="font-weight:600; font-size:12px; display:flex; align-items:center; gap:6px; z-index:3; color:${stage.color}">
          <i class="ti ti-chevron-${scol?'right':'down'}" style="font-size:14px;color:${stage.color}"></i>
          <span style="width:8px;height:8px;border-radius:50%;background:${stage.color};display:inline-block;flex-shrink:0"></span>
          ${stage.name}
        </div>
        ${stageBarHtml}
      </div>`;
      
      if (!scol) {
        stageTasks.forEach(t => {
          const status = getTaskStatus(t.id);
          const { start, end } = getTaskDates(t);
          const startD  = Math.floor((start - projStart)/(24*3600*1000));
          const endD    = Math.floor((end - projStart)/(24*3600*1000));
          const leftPct = Math.max(0,(startD/TOTAL_D)*100);
          const widthPct= Math.max(.5,((endD-startD+1)/TOTAL_D)*100);
          
          let barColor = status==='completado'?'var(--green)': status==='retrasado'?'var(--red)': status==='curso'?'var(--blue)':stage.color;
          let barStyle = `background:${barColor};`;
          
          if(t.type === 'revision') {
             barStyle = `background: repeating-linear-gradient(45deg, ${barColor}, ${barColor} 6px, rgba(255,255,255,0.4) 6px, rgba(255,255,255,0.4) 12px);`;
          }

          const safeName = (t.name||'').replace(/"/g, '&quot;');
          html += `<div class="gantt-row" style="cursor:pointer" onclick="openTask('${t.id}',${stage.id})">
            <div style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:8px;color:${status==='completado'?'var(--text3)':'var(--text)'}${status==='completado'?';text-decoration:line-through':''}" title="${safeName}">${t.name}</div>
            <div class="gantt-bar-cell">
              <div class="gantt-today-line" style="left:${tf*100}%"></div>
              <div class="gantt-bar" style="left:${leftPct}%; width:${widthPct}%; ${barStyle} ${status==='completado'?';opacity:.5':''}" title="${safeName}"></div>
            </div>
          </div>`;
        });
      }
    });
    html += '</div></div>';
    el.innerHTML = html;
  } catch(e) { console.error(e); }
}

function toggleGanttSection(id) {
  if (!state.ganttCollapsed) state.ganttCollapsed = {};
  state.ganttCollapsed[id] = !state.ganttCollapsed[id];
  saveState();
}

function buildShareText(previewOnly=false) {

function copyShareMsg(){

    document.body.appendChild(ta); ta.select(); document.execCommand('copy');

}

//  MODAL TAREA 
// ═══════════════════════════════════════════════════════
function openTask(taskId, stageId) {
  const t = getAllTasks().find(x => x.id===taskId);
  if (!t) return;
  const stage  = STAGES.find(s=>s.id===stageId)||{name:'',color:'var(--border2)'};
  const status = getTaskStatus(taskId);
  const { start, end } = getTaskDates(t);
  const note   = state.notes&&state.notes[taskId]||'';
  const sdInput= !isNaN(start) ? toYMD(start) : '';
  const edInput= !isNaN(end) ? toYMD(end) : '';
  const teamOpts= (state.team||[]).map(m=>`<option value="${m.name}" ${t.assignee===m.name?'selected':''}>${m.name}</option>`).join('');

        <h4 style="color:var(--green);"><i class="ti ti-star-filled"></i> Autoevaluación del equipo</h4>
        <div class="stars-input" id="modal-stars" style="display:flex;align-items:center;">
          <div>${[1,2,3,4,5].map(i=>`<button class="star-btn ${ev>=i?'on-green':''}" onclick="setEvM('${taskId}',${i},false)">★</button>`).join('')}</div>
          <span style="font-size:11px;color:var(--green);margin-left:12px;cursor:pointer;text-decoration:underline" onclick="setEvM('${taskId}',0,false)">Desmarcar</span>
        </div>
      </div>
    </div>`;
  } else if (isRev) {
    evalSection = `
    <div style="background:var(--amber-light);border:1px solid var(--amber);border-radius:var(--radius);padding:12px;margin-bottom:12px">
      <div class="eval-section">
        <h4 style="color:#a87000;"><i class="ti ti-building-bank"></i> Feedback de la Contraparte</h4>
        <div class="stars-input" id="modal-stars-client" style="display:flex;align-items:center;">
          <div>${[1,2,3,4,5].map(i=>`<button class="star-btn ${evC>=i?'on':''}" onclick="setEvM('${taskId}',${i},true)">★</button>`).join('')}</div>
          <span style="font-size:11px;color:#a87000;margin-left:12px;cursor:pointer;text-decoration:underline" onclick="setEvM('${taskId}',0,true)">Desmarcar</span>
        </div>
      </div>
    </div>`;
  }

  const subsDone  = subs.filter(s=>s.status==='completado').length;
  const subsPct   = subsTotal > 0 ? Math.round(subsDone/subsTotal*100) : 0;
  const teamSubOpts = (state.team||[]).map(m=>`<option value="${m.name}">${m.name}</option>`).join('');

    <div style="margin-bottom:12px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:12px;">

      ${subsTotal > 0 ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden"><div style="height:100%;width:${subsPct}%;background:var(--green);border-radius:3px;transition:width .3s"></div></div><span style="font-size:11px;color:var(--text2);white-space:nowrap">${subsDone}/${subsTotal} (${subsPct}%)</span></div>` : '<p style="font-size:11px;color:var(--text3);margin-bottom:8px">No hay subtareas. Puedes agregar micro-actividades aquí.</p>'}
      
      <div style="margin-bottom:8px">
        ${subs.map((s,si)=>`
        <div class="sub-row">
          <i class="ti ti-${s.status==='completado'?'check':'circle'}" style="color:${s.status==='completado'?'var(--green)':'var(--border2)'}; font-size:18px; cursor:pointer;" onclick="toggleSubM('${taskId}','${s.id}')"></i>
          <input type="text" value="${(s.name||'').replace(/"/g, '&quot;')}" onchange="updateSubM('${taskId}','${s.id}','name',this.value)" placeholder="Descripción de subtarea" style="flex:1;min-width:0"/>
          <select onchange="updateSubM('${taskId}','${s.id}','assignee',this.value)" style="width:130px;padding:6px 6px;border:1px solid var(--border2);border-radius:4px;font-size:12px;background:var(--bg);color:var(--text);outline:none">
            <option value="">Responsable</option>${teamSubOpts.replace(`value="${s.assignee||''}"`,`value="${s.assignee||''}" selected`)}
          </select>
          <input type="date" value="${s.date||''}" onchange="updateSubM('${taskId}','${s.id}','date',this.value)"/>
          <i class="ti ti-trash" onclick="deleteSubM('${taskId}','${s.id}')" style="cursor:pointer; color:var(--red); font-size:16px; margin-left:4px;"></i>
        </div>`).join('')}
      </div>
      <div style="display:flex;gap:6px">
        <input id="new-sub-name" type="text" placeholder="Escribe una nueva subtarea..." style="flex:1;padding:6px 8px;border:1px solid var(--border2);border-radius:4px;font-size:12px;background:var(--bg);color:var(--text);outline:none"/>
        <button class="btn btn-sm btn-primary" onclick="addSubM('${taskId}')"><i class="ti ti-plus"></i></button>
      </div>

  modal(`
    <h3 style="margin-bottom:4px">${t.name}</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:14px"><span style="width:8px;height:8px;border-radius:50%;background:${stage.color};display:inline-block;margin-right:4px"></span>${stage.name} · ${badge(t.type)}</p>
    <div class="form-row">

}

function setStM(id, val) {
  state.statuses[id] = val;
  ['pendiente','curso','retrasado','completado'].forEach(st => {
    const b = document.getElementById('btn-st-'+st);
    if (b) b.className = 'btn';
  });
  const b = document.getElementById('btn-st-'+val);
  if (b) b.className = val==='curso'?'btn btn-blue':(val==='retrasado'?'btn btn-red':'btn btn-primary');
}

function setEvM(id, val, isClient) {
  if (isClient) {
    if (!state.evaluationsClient) state.evaluationsClient = {};
    if (state.evaluationsClient[id]===val) val=0;
    state.evaluationsClient[id] = val;
    document.querySelectorAll('#modal-stars-client .star-btn').forEach((b,i)=>b.className='star-btn'+(val>=i+1?' on':''));
  } else {
    if (!state.evaluations) state.evaluations = {};
    if (state.evaluations[id]===val) val=0;
    state.evaluations[id] = val;
    document.querySelectorAll('#modal-stars .star-btn').forEach((b,i)=>b.className='star-btn'+(val>=i+1?' on-green':''));
  }
}

function addSubM(parentId) {
  const name = document.getElementById('new-sub-name').value.trim();
  if (!name) return;
  if (!state.subtasks) state.subtasks = {};
  if (!state.subtasks[parentId]) state.subtasks[parentId] = [];
  state.subtasks[parentId].push({ id:'sub'+Date.now(), name, status:'pendiente', assignee:'', date:'' });
  logAction(`Se agregó una subtarea en una actividad.`);
  saveState();
  openTask(parentId, getAllTasks().find(t=>t.id===parentId).stageId);
}
function updateSubM(pId, sId, field, val) {
  const sub = state.subtasks[pId].find(s=>s.id===sId);
  if (sub) { sub[field]=val; saveState(); }
}
function toggleSubM(pId, sId) {
  const sub = state.subtasks[pId].find(s=>s.id===sId);
  if (sub) {
    sub.status = sub.status==='completado'?'pendiente':'completado';
    logAction(`Subtarea marcada como ${sub.status}.`);
    // Auto-complete parent if all subtasks done
    const allSubs = state.subtasks[pId];
    if (allSubs.length > 0 && allSubs.every(s=>s.status==='completado')) {
      state.statuses[pId] = 'completado';
      logAction(`Tarea padre completada automáticamente (todas las subtareas completadas).`);
    } else if (sub.status === 'pendiente' && state.statuses[pId] === 'completado') {
      state.statuses[pId] = 'curso';
    }
    saveState();
    openTask(pId, getAllTasks().find(t=>t.id===pId).stageId);
  }
}
function deleteSubM(pId, sId) {
  state.subtasks[pId] = state.subtasks[pId].filter(s=>s.id!==sId);
  saveState();
  openTask(pId, getAllTasks().find(t=>t.id===pId).stageId);
}

function saveTaskModal(id) {
  const t    = getAllTasks().find(x=>x.id===id);
  const oldA = t.assignee;
  const oldSt= getTaskStatus(id);
  if (!state.notes) state.notes = {};
  state.notes[id] = document.getElementById('modal-note').value;
  const start   = document.getElementById('modal-start').value;
  const end     = document.getElementById('modal-end').value;
  const assignee= document.getElementById('modal-assignee').value;
  if (oldA!==assignee && assignee!=='') logAction(`Se asignó una tarea a ${assignee}.`);
  if (oldSt!==state.statuses[id]) logAction(`Cambio de estado a ${state.statuses[id]} en una actividad.`);
  if (!state.taskOverrides) state.taskOverrides = {};
  state.taskOverrides[id] = { startDate: start, endDate: end, assignee };
  if (state.customTasks) {
    const ct = state.customTasks.find(x=>x.id===id);
    if (ct) { ct.startDate=start; ct.endDate=end; ct.assignee=assignee; }
  }
  saveState(); closeModal();
}

function deleteTaskModal(id) {
  if (!confirm('¿Eliminar esta actividad permanentemente?')) return;
  if (!state.deletedIds) state.deletedIds = [];
  state.deletedIds.push(id);
  logAction(`Se eliminó una actividad.`);
  saveState(); closeModal();
}

//  GOOGLE CALENDAR LINK
// ═══════════════════════════════════════════════════════
function generateGCalLink(task) {
  try {
    const { start, end } = getTaskDates(task);
    if (!start || !end || isNaN(start) || isNaN(end)) return '#';
    const s = start.toISOString().replace(/-|:|\.\d+/g, '').slice(0,8);
    const endPlusOne = new Date(end);
    endPlusOne.setDate(endPlusOne.getDate() + 1);
    const endStr = endPlusOne.toISOString().replace(/-|:|\.\d+/g, '').slice(0,8);
    const meta = currentProjId ? allProjects[currentProjId].meta : {};
    const safeName = encodeURIComponent(task.name || '');
    const safeDetails = encodeURIComponent(`Responsable: ${task.assignee || 'Sin asignar'}\n\nProyecto: ${meta.name||''}`);
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${safeName}&dates=${s}/${endStr}&details=${safeDetails}`;
  } catch(e) {
    return '#';
  }
}
