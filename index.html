<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Proyectos Jorge Paz</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f6f7f8;--bg3:#f0f1f3;
  --text:#111;--text2:#555;--text3:#999;
  --border:#e0e0e0;--border2:#ccc;
  --green:#1D9E75;--green-light:#E1F5EE;
  --blue:#378ADD;--blue-light:#E6F1FB;
  --orange:#D85A30;--orange-light:#FAECE7;
  --purple:#7F77DD;--purple-light:#EEEDFE;
  --amber:#EF9F27;--amber-light:#FAEEDA;
  --red:#d63939;--red-light:#fdebeb;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a1a;--bg2:#242424;--bg3:#2c2c2c;
    --text:#f0f0f0;--text2:#aaa;--text3:#666;
    --border:#333;--border2:#444;
    --green-light:#0a3326;--blue-light:#0a1e35;
    --orange-light:#3a1a0a;--purple-light:#1a1845;
    --amber-light:#3a2500;--red-light:#3d1010;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* ── LOADING ── */
#loading-overlay{position:fixed;inset:0;background:var(--bg);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LAYOUT COMMON ── */
.screen{display:none;max-width:1100px;margin:0 auto;padding:20px 16px}
.screen.active{display:block}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:34px;height:34px;border-radius:var(--radius);background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.brand h1{font-size:16px;font-weight:600;color:var(--text)}
.brand p{font-size:11px;color:var(--text3);margin-top:1px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── BUTTONS ── */
.btn{padding:7px 14px;border-radius:var(--radius);font-size:13px;cursor:pointer;border:1px solid var(--border2);background:var(--bg);color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:background .15s;text-decoration:none;position:relative}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-primary:hover{background:#0f6e56;color:#fff}
.btn-danger{color:#c00;border-color:#fcc}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}

/* ── PROJECT CARDS ── */
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:10px;display:flex;justify-content:space-between}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:24px}
.project-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;position:relative;overflow:visible}
.project-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);border-color:var(--border2)}
.project-card.archived{opacity:0.6;}
.pc-accent{position:absolute;top:0;left:0;right:0;height:3px}
.pc-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;margin-top:6px;line-height:1.3;padding-right:20px;}
.pc-client{font-size:12px;color:var(--text2);margin-bottom:12px}
.pc-meta{display:flex;gap:12px;font-size:11px;color:var(--text3)}
.pc-pbar{height:4px;background:var(--border);border-radius:2px;margin-top:10px;overflow:hidden}
.pc-pbar-inner{height:100%;border-radius:2px}
.pc-type-badge{position:absolute;top:14px;right:34px;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge-propuesta{background:var(--amber-light);color:#8a5c00}
.badge-proyecto{background:var(--green-light);color:var(--green)}
.badge-perdida{background:var(--red-light);color:var(--red)}
.new-card{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:130px;color:var(--text3)}
.new-card:hover{border-color:var(--green);background:var(--green-light);color:var(--green)}

/* 3 dots menu */
.pc-menu-btn{position:absolute;top:10px;right:6px;width:24px;height:24px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-radius:4px;font-size:16px}
.pc-menu-btn:hover{background:var(--bg2)}
.pc-dropdown{display:none;position:absolute;top:34px;right:6px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:20;min-width:140px;overflow:hidden}
.pc-dropdown.show{display:block}
.pc-dd-item{padding:8px 12px;font-size:12px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:6px;}
.pc-dd-item:hover{background:var(--bg2)}
.pc-dd-danger{color:var(--red)}

/* ── TABS ── */
.tab-row{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0;overflow-x:auto;scrollbar-width:none;}
.tab-row::-webkit-scrollbar{display:none;}
.tab{padding:8px 16px;border-radius:var(--radius) var(--radius) 0 0;font-size:13px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text2);margin-bottom:-1px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tab.active{background:var(--bg);border-color:var(--border);border-bottom-color:var(--bg);color:var(--text);font-weight:500}

/* ── STATS & PROGRESS ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--border)}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:600;color:var(--text)}
.stat-sub{font-size:11px;color:var(--text3);margin-top:2px}
.week-progress{background:var(--bg2);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;border:1px solid var(--border)}
.pbar-outer{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.pbar-inner{height:100%;background:var(--green);border-radius:4px;transition:width .4s}

/* ── TASK LIST ── */
.section{margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg2);cursor:pointer;gap:10px}
.section-title{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;flex:1}
.pbar-sm{width:70px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.pbar-sm-inner{height:100%;border-radius:3px}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:8px 14px;border-top:1px solid var(--border);cursor:pointer;transition:background .12s}
.task-row:hover{background:var(--bg2)}
.task-row.done .task-name{text-decoration:line-through;color:var(--text3)}
.status-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.si-pendiente{color:var(--border2)}.si-curso{color:var(--blue)}.si-retrasado{color:var(--red)}.si-completado{color:var(--green)}
.task-info{flex:1;min-width:0}
.task-name{font-size:13px;color:var(--text);line-height:1.4}
.task-right{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-producto{background:var(--blue-light);color:var(--blue)}
.badge-revision{background:var(--amber-light);color:#8a5c00}
.badge-hito{background:#fff0f0;color:#c00}
.add-task-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;font-size:12px;color:var(--text2);cursor:pointer;border-top:1px dashed var(--border)}

/* ── SUBTASKS ── */
.subtask-indented{padding:6px 14px 6px 44px;background:var(--bg);border-top:1px dashed var(--border);display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}
.subtask-indented:hover{background:var(--bg2)}
.subtask-indented.done .st-name{text-decoration:line-through;color:var(--text3)}
.modal-subtasks{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.sub-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border)}
.sub-row:last-child{border-bottom:none}
.sub-row input[type="text"]{flex:1;background:var(--bg);border:1px solid var(--border2);padding:6px 8px;font-size:12px;border-radius:4px;outline:none}
.sub-row input[type="date"]{width:110px;background:var(--bg);border:1px solid var(--border2);padding:6px;font-size:11px;border-radius:4px;outline:none}
.sub-row select{width:120px;background:var(--bg);border:1px solid var(--border2);padding:6px;font-size:11px;border-radius:4px;outline:none}
.sub-prog-bar{height:4px;background:var(--border);border-radius:2px;width:60px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.sub-prog-inner{height:100%;background:var(--blue)}

/* ── KANBAN ── */
.board-container{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.board-col{flex:1;min-width:240px;background:var(--bg2);border-radius:var(--radius-lg);padding:12px;border:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.board-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;border-left:4px solid var(--border2)}

/* ── GANTT ── */
.gantt-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg)}
.gantt-inner{min-width:820px}
.gantt-head-row{display:grid;grid-template-columns:300px 1fr;font-size:11px;color:var(--text2);padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.gantt-row{display:grid;grid-template-columns:300px 1fr;align-items:center;padding:5px 14px;border-top:1px solid var(--border);font-size:12px;position:relative;cursor:pointer;}
.gantt-row:hover{background:var(--bg2)!important}
.gantt-bar-cell{position:relative;height:14px;width:100%}
.gantt-bar{position:absolute;height:100%;border-radius:3px;z-index:1}
.gantt-today-line{position:absolute;top:0;width:2px;height:100%;background:rgba(216,90,48,.8);z-index:10;pointer-events:none}
.month-labels{display:flex;font-size:10px;color:var(--text3);height:100%;align-items:center;}
.month-col{flex:1;text-align:center;border-left:1px solid var(--border2);height:100%;display:flex;align-items:center;justify-content:center;font-weight:600;}

/* ── NOTIFICATIONS & MODALS ── */
.dropdown{position:relative;display:inline-block}
.notif-badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:white;font-size:10px;font-weight:bold;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;z-index:10}
.dropdown-content{display:none;position:absolute;right:0;top:100%;margin-top:8px;width:280px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:9999}
.dropdown-content.show{display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px}
.modal{background:var(--bg);border-radius:var(--radius-lg);border:1px solid var(--border2);padding:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.form-row{margin-bottom:12px}
.form-row label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;font-weight:500}
.form-row input,.form-row textarea,.form-row select{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;background:var(--bg);color:var(--text);outline:none}
.modal-actions{display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.stars-input{display:flex;gap:4px}
.star-btn{font-size:22px;cursor:pointer;color:var(--border2);background:none;border:none;padding:0;line-height:1}
.star-btn.on{color:var(--amber)}.star-btn.on-green{color:var(--green)}
.import-area{border:2px dashed var(--border2);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;background:var(--bg2)}
.import-area:hover{border-color:var(--green)}

/* Global Tasks List */
.gt-row {display:flex; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border); gap:12px; background:var(--bg);}
.gt-row:hover {background:var(--bg2);}
.gt-proj {font-size:11px; color:var(--text3); font-weight:600;}
</style>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div><p style="color:var(--text2)">Conectando...</p></div>

<div id="screen-home" class="screen active">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon"><i class="ti ti-layout-dashboard"></i></div>
      <div>
        <h1>Mis Proyectos</h1>
        <p>Sistema de gestión de consultoría · Proyectos Jorge Paz</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="openGlobalTasks()"><i class="ti ti-list"></i> Visión Global</button>
      <button class="btn btn-primary" onclick="openNewProjectModal()"><i class="ti ti-plus"></i> Nuevo proyecto</button>
    </div>
  </div>
  <div id="home-projects-list"></div>
</div>

<div id="screen-project" class="screen">
  <div class="proj-topbar">
    <div class="proj-title-area">
      <h1 id="proj-title">—</h1>
      <p id="proj-subtitle">—</p>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="goHome()"><i class="ti ti-arrow-left"></i> Mis proyectos</button>
      <div class="dropdown">
        <button class="btn" onclick="toggleNotifs(event)"><i class="ti ti-bell"></i> Actividad</button>
        <span class="notif-badge" id="notif-badge" style="display:none">0</span>
        <div class="dropdown-content" id="notif-dropdown">
          <div style="padding:10px;font-size:12px;font-weight:600;border-bottom:1px solid var(--border);background:var(--bg2)">Últimos 5 movimientos</div>
          <div id="notif-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="week-progress-bar"></div>
  <div class="stats" id="stats-bar"></div>

  <div class="tab-row">
    <button class="tab active" onclick="setTab('tasks',this)"><i class="ti ti-list-check"></i> Actividades</button>
    <button class="tab" onclick="setTab('gantt',this)"><i class="ti ti-chart-gantt"></i> Gantt</button>
    <button class="tab" onclick="setTab('board',this)"><i class="ti ti-layout-kanban"></i> Tablero</button>
    <button class="tab" onclick="setTab('eval',this)"><i class="ti ti-star"></i> Evaluaciones</button>
    <button class="tab" onclick="setTab('team',this)"><i class="ti ti-users"></i> Equipo</button>
    <button class="tab" onclick="setTab('share',this)"><i class="ti ti-share"></i> Publicar</button>
    <button class="tab" onclick="setTab('config',this)"><i class="ti ti-settings"></i> Config</button>
  </div>

  <div id="tab-tasks"></div>
  <div id="tab-gantt"  style="display:none"></div>
  <div id="tab-board" style="display:none"></div>
  <div id="tab-eval"  style="display:none"></div>
  <div id="tab-team"  style="display:none"></div>
  <div id="tab-share" style="display:none"></div>
  <div id="tab-config" style="display:none"></div>
</div>

<div id="screen-global" class="screen">
  <div class="proj-topbar">
    <div class="proj-title-area">
      <h1>Visión Global de Tareas</h1>
      <p>Todas las actividades de todos los proyectos activos</p>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="goHome()"><i class="ti ti-arrow-left"></i> Volver</button>
    </div>
  </div>
  <div class="filter-bar" id="global-filters"></div>
  <div class="section" id="global-tasks-list"></div>
</div>

<div id="modal-root"></div>

<script>
// ═══════════════════════════════════════════════════════
//  FIREBASE CONFIGURATION
// ═══════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyBmh1KNxCs7-eM8OSx6uHjxbIwwEgH_ju4",
  authDomain:        "proyectos-jpaz.firebaseapp.com",
  projectId:         "proyectos-jpaz",
  storageBucket:     "proyectos-jpaz.firebasestorage.app",
  messagingSenderId: "656956112515",
  appId:             "1:656956112515:web:bea06ac8c3df2b25a8e5b6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ═══════════════════════════════════════════════════════
//  GLOBAL STATE
// ═══════════════════════════════════════════════════════
const STAGE_PALETTE = [
  {color:'#1D9E75',light:'var(--green-light)'},
  {color:'#378ADD',light:'var(--blue-light)'},
  {color:'#D85A30',light:'var(--orange-light)'},
  {color:'#7F77DD',light:'var(--purple-light)'}
];

let allProjects   = {};        
let currentProjId = null;
let projListener  = null;     
let state         = {};       
let STAGES        = [];       
let currentTab    = 'tasks';
let filterAssignee= 'all';
let filterStatus  = 'all';
let unseenLogs    = 0;
let isFirstLoad   = true;
let hideCompletedGantt = false;
let globalTasksData = [];

// ═══════════════════════════════════════════════════════
//  BOOTSTRAP & HOME
// ═══════════════════════════════════════════════════════
async function loadProjectList() {
  try {
    const snap = await db.collection('projects').get();
    allProjects = {};
    snap.forEach(doc => { allProjects[doc.id] = { meta: doc.data() }; });
    renderHome();
  } catch(e) { console.error(e); } 
  finally { document.getElementById('loading-overlay').style.display = 'none'; }
}

let showArchived = false;

function renderHome() {
  const ids = Object.keys(allProjects);
  const el  = document.getElementById('home-projects-list');

  const activos    = ids.filter(id => allProjects[id].meta.type === 'proyecto' && allProjects[id].meta.status !== 'archived');
  const propuestas = ids.filter(id => allProjects[id].meta.type === 'propuesta' && allProjects[id].meta.status !== 'archived');
  const archivados = ids.filter(id => allProjects[id].meta.status === 'archived');

  let html = '';
  if (activos.length > 0) {
    html += `<div class="section-label"><i class="ti ti-briefcase"></i> Proyectos activos</div><div class="projects-grid">`;
    activos.forEach(id => html += buildProjectCard(id));
    html += `</div>`;
  }
  if (propuestas.length > 0) {
    html += `<div class="section-label"><i class="ti ti-file-description"></i> Propuestas técnicas / Pipeline</div><div class="projects-grid">`;
    propuestas.forEach(id => html += buildProjectCard(id));
    html += `</div>`;
  }

  html += `<div class="projects-grid"><div class="new-card" onclick="openNewProjectModal()"><i class="ti ti-plus"></i><span>Nuevo proyecto o propuesta</span></div></div>`;

  // Archived section toggle
  html += `<div style="text-align:center; margin-top:30px; border-top:1px solid var(--border); padding-top:20px;">
    <button class="btn" onclick="showArchived=!showArchived; renderHome()"><i class="ti ti-archive"></i> ${showArchived ? 'Ocultar' : 'Ver'} proyectos archivados (${archivados.length})</button>
  </div>`;

  if(showArchived && archivados.length > 0) {
    html += `<div class="projects-grid" style="margin-top:20px; opacity:0.7">`;
    archivados.forEach(id => html += buildProjectCard(id));
    html += `</div>`;
  }
  
  el.innerHTML = html;
}

function buildProjectCard(id) {
  const m = allProjects[id].meta;
  const pct = m.lastPct || 0;
  
  let badgeHtml = '';
  if (m.type === 'propuesta') {
      const pStat = m.proposalStatus || 'postulada';
      if(pStat==='adjudicada') badgeHtml = '<span class="pc-type-badge badge-proyecto">Adjudicada</span>';
      else if(pStat==='perdida') badgeHtml = '<span class="pc-type-badge badge-perdida">Perdida</span>';
      else badgeHtml = '<span class="pc-type-badge badge-propuesta">Postulada</span>';
  } else {
      badgeHtml = '<span class="pc-type-badge badge-proyecto">Proyecto</span>';
  }
  if(m.status === 'archived') badgeHtml += ' <span class="pc-type-badge" style="right:80px;background:var(--border);color:var(--text2)">Archivado</span>';

  return `
    <div class="project-card" onclick="openProject('${id}')">
      <div class="pc-accent" style="background:${m.accentColor||'var(--green)'}"></div>
      ${badgeHtml}
      
      <button class="pc-menu-btn" onclick="event.stopPropagation(); toggleMenu('menu-${id}')"><i class="ti ti-dots-vertical"></i></button>

        <div class="pc-dd-item" onclick="openProject('${id}')"><i class="ti ti-edit"></i> Abrir / Editar</div>
        ${m.type === 'propuesta' && m.status !== 'archived' ? `
          <div class="pc-dd-item" onclick="changeProjState('${id}', 'proposalStatus', 'adjudicada')"><i class="ti ti-trophy"></i> Marcar Adjudicada</div>
          <div class="pc-dd-item" onclick="changeProjState('${id}', 'proposalStatus', 'perdida')"><i class="ti ti-x"></i> Marcar Perdida</div>
        ` : ''}
        ${m.status !== 'archived' ? `<div class="pc-dd-item" onclick="changeProjState('${id}', 'status', 'archived')"><i class="ti ti-archive"></i> Finalizar / Archivar</div>` : `<div class="pc-dd-item" onclick="changeProjState('${id}', 'status', 'active')"><i class="ti ti-arrow-back-up"></i> Desarchivar</div>`}
        <div class="pc-dd-item pc-dd-danger" onclick="deleteProject('${id}')"><i class="ti ti-trash"></i> Eliminar</div>
      </div>

      <div class="pc-title">${m.name}</div>
      <div class="pc-client">${m.client||'Sin cliente'}</div>
      <div class="pc-meta">
        <span><i class="ti ti-calendar"></i> ${m.startDate||'—'}</span>
        <span><i class="ti ti-clock"></i> ${m.totalWeeks||0} sem</span>
        ${m.type==='proyecto' ? `<span><i class="ti ti-chart-pie"></i> ${pct}%</span>` : ''}
      </div>
      ${m.type==='proyecto' ? `<div class="pc-pbar"><div class="pc-pbar-inner" style="width:${pct}%;background:${m.accentColor||'var(--green)'}"></div></div>` : ''}
    </div>`;
}

function toggleMenu(menuId) {
    document.querySelectorAll('.pc-dropdown').forEach(d => { if(d.id !== menuId) d.classList.remove('show'); });
    document.getElementById(menuId).classList.toggle('show');
}
window.addEventListener('click', () => { document.querySelectorAll('.pc-dropdown').forEach(d => d.classList.remove('show')); });

async function changeProjState(id, field, val) {
    try {
        const update = {}; update[field] = val;
        if(field === 'proposalStatus' && val === 'adjudicada') update.type = 'proyecto'; // Adjudicada pasa a proyecto
        if(field === 'proposalStatus' && val === 'perdida') update.status = 'archived'; // Perdida se archiva
        
        await db.collection('projects').doc(id).update(update);
        allProjects[id].meta = { ...allProjects[id].meta, ...update };
        renderHome();
    } catch(e) { alert("Error actualizando estado."); }
}

async function deleteProject(id) {
  if (!confirm(`¿Eliminar permanentemente? Esta acción es irreversible.`)) return;
  try {
    await db.collection('projects').doc(id).collection('runtime').doc('state').delete();
    await db.collection('projects').doc(id).delete();
    delete allProjects[id]; renderHome();
  } catch(e) { alert('Error al eliminar.'); }
}

let tempExcelStages = [];

function downloadExcelTemplate() {
    const ws_data = [
        ["Etapa", "Actividad", "Tipo (tarea/hito/producto/revision)", "Responsable", "Semana Inicio", "Semana Fin"],
        ["Fase 1: Preparación", "Reunión Kickoff", "hito", "Ana", 1, 1],
        ["Fase 1: Preparación", "Elaborar Plan", "tarea", "Luis", 1, 2],
        ["Fase 2: Ejecución", "Trabajo de campo", "tarea", "María", 3, 5],
        ["Fase 2: Ejecución", "Informe Final", "producto", "Ana", 6, 6]
    ];
    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Actividades");
    XLSX.writeFile(wb, "Plantilla_Proyectos.xlsx");
}

function handleExcelFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('excel-status').innerText = "Procesando archivo...";
    const reader = new FileReader();
    reader.onload = function(evt) {
        try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet);
            
            // Agrupar por etapa
            const stageMap = {};
            json.forEach((row, i) => {
                const etapa = row['Etapa'] || 'Etapa 1';
                if(!stageMap[etapa]) stageMap[etapa] = [];
                stageMap[etapa].push({
                    id: `e${Date.now()}-${i}`,
                    name: row['Actividad'] || 'Tarea sin nombre',
                    type: (row['Tipo (tarea/hito/producto/revision)'] || 'tarea').toLowerCase(),
                    assignee: row['Responsable'] || '',
                    week: parseInt(row['Semana Inicio']) || 1,
                    weeks: [parseInt(row['Semana Inicio']) || 1, parseInt(row['Semana Fin']) || parseInt(row['Semana Inicio']) || 1]
                });
            });

            tempExcelStages = Object.keys(stageMap).map((k, i) => {
                const tasks = stageMap[k];
                const allW = tasks.flatMap(t=>t.weeks||[t.week]);
                return { id: i+1, name: k, weeks: [Math.min(...allW), Math.max(...allW)], tasks };
            });
            document.getElementById('excel-status').innerHTML = `<b>¡Éxito!</b> ${tempExcelStages.length} etapas cargadas listas para importar.`;
            document.getElementById('excel-status').style.color = "var(--green)";
        } catch(err) {
            document.getElementById('excel-status').innerText = "Error leyendo Excel. Revisa el formato.";
            document.getElementById('excel-status').style.color = "var(--red)";
        }
    };
    reader.readAsArrayBuffer(file);
}

async function saveNewProject() {
  const name   = document.getElementById('np-name').value.trim();
  const client = document.getElementById('np-client').value.trim();
  const start  = document.getElementById('np-start').value;
  const type   = document.getElementById('np-type').value;
  const weeks  = parseInt(document.getElementById('np-weeks').value)||20;
  if (!name) { alert('El nombre es obligatorio.'); return; }

  const meta = {
    name, client, startDate: start, totalWeeks: weeks, type, 
    stages: tempExcelStages.length > 0 ? tempExcelStages : [],
    accentColor: STAGE_PALETTE[Object.keys(allProjects).length % STAGE_PALETTE.length].color,
    status: 'active', createdAt: Date.now(), lastPct: 0
  };

  if(type === 'propuesta') {
      meta.idLicitacion = document.getElementById('np-licitacion').value;
      meta.fechaCierre = document.getElementById('np-cierre').value;
      meta.fechaAdjudicacion = document.getElementById('np-adjudica').value;
      meta.proposalStatus = 'postulada';
  }

  try {
    const ref = await db.collection('projects').add(meta);
    allProjects[ref.id] = { meta };
    tempExcelStages = [];
    closeModal();
    openProject(ref.id);
  } catch(e) { alert('Error al guardar.'); }
}

async function openGlobalTasks() {
    showScreen('global');
    document.getElementById('global-tasks-list').innerHTML = `<div style="text-align:center;padding:40px"><div class="spinner" style="margin:0 auto"></div><p>Cargando datos globales...</p></div>`;
    
    // Obtener tareas de todos los proyectos activos
    globalTasksData = [];
    const activeIds = Object.keys(allProjects).filter(id => allProjects[id].meta.type === 'proyecto' && allProjects[id].meta.status !== 'archived');
    
    // Generar promesas
    const promises = activeIds.map(id => db.collection('projects').doc(id).collection('runtime').doc('state').get().then(doc => {
        if(!doc.exists) return;
        const pState = doc.data();
        const pMeta = allProjects[id].meta;
        
        // Recorrer tareas del proyecto
        const stgs = pMeta.stages || [];
        stgs.forEach(s => {
            s.tasks.forEach(t => {
                if(pState.deletedIds && pState.deletedIds.includes(t.id)) return;
                const ov = pState.taskOverrides && pState.taskOverrides[t.id];
                const finalT = { ...t, ...(ov||{}), pId: id, pName: pMeta.name, status: pState.statuses?.[t.id]||'pendiente' };
                // Fechas
                const start = finalT.startDate ? parseLocal(finalT.startDate) : parseLocal(pMeta.startDate); // Simplificado para listado
                finalT.time = start.getTime();
                globalTasksData.push(finalT);
            });
        });
        // Tareas custom
        (pState.customTasks||[]).forEach(t => {
            if(pState.deletedIds && pState.deletedIds.includes(t.id)) return;
            const ov = pState.taskOverrides && pState.taskOverrides[t.id];
            const finalT = { ...t, ...(ov||{}), pId: id, pName: pMeta.name, status: pState.statuses?.[t.id]||'pendiente' };
            const start = finalT.startDate ? parseLocal(finalT.startDate) : new Date();
            finalT.time = start.getTime();
            globalTasksData.push(finalT);
        });
    }));

    await Promise.all(promises);
    globalTasksData.sort((a,b) => a.time - b.time);
    renderGlobalTasks();
}

let globalFilterPerson = 'all';
let globalFilterProj = 'all';

function renderGlobalTasks() {
    const pOpts = Object.keys(allProjects).filter(id => allProjects[id].meta.type === 'proyecto' && allProjects[id].meta.status !== 'archived')

function updateGlobalList() {
    const list = document.getElementById('global-tasks-list');

function openProject(id) {
  currentProjId = id;
  const meta = allProjects[id].meta;
  isFirstLoad = true; unseenLogs = 0;

  STAGES = (meta.stages || []).map((s, i) => ({ ...s, color: STAGE_PALETTE[i % STAGE_PALETTE.length].color, light: STAGE_PALETTE[i % STAGE_PALETTE.length].light }));

  document.getElementById('proj-title').textContent = meta.name;
  document.getElementById('proj-subtitle').textContent = `${meta.client||'Sin cliente'} · Inicio: ${fmtDateStr(meta.startDate)} · ${meta.totalWeeks} semanas`;
  setTab('tasks', document.querySelector('.tab'));
  showScreen('project');

  const stateRef = db.collection('projects').doc(id).collection('runtime').doc('state');
  if (projListener) projListener();
  projListener = stateRef.onSnapshot(doc => {
    if (doc.exists) {
      const oldLen = state.logs ? state.logs.length : 0;
      state = doc.data();
      ensureStateFallbacks(meta.startDate);
      if (state.logs.length > oldLen && !isFirstLoad) {
        unseenLogs += (state.logs.length - oldLen);
        updateNotifBadge();
      }
    } else {
      state = buildDefaultState(meta.startDate); saveState();
    }
    isFirstLoad = false;
    autoUpdateDelays(); renderAllViews(); renderNotifs();
    const s = calcStats();
    if ((meta.lastPct||0) !== s.pct) { db.collection('projects').doc(id).update({ lastPct: s.pct }); allProjects[id].meta.lastPct = s.pct; }
  });
}

function buildDefaultState(startDate) {
  return { startDate: startDate || '', statuses: {}, evaluations: {}, evaluationsClient: {}, notes: {}, collapsed: {}, ganttCollapsed: {}, taskOverrides: {}, customTasks: [], deletedIds: [], subtasks: {}, logs: [], team: [] };
}
function ensureStateFallbacks(startDate) {
  ['statuses','evaluations','evaluationsClient','notes','collapsed','ganttCollapsed','taskOverrides','subtasks'].forEach(k => { if(!state[k]) state[k]={}; });
  ['customTasks','deletedIds','logs','team'].forEach(k => { if(!state[k]) state[k]=[]; });
  if (!state.startDate) state.startDate = startDate || '';
}

// ... Todas las validaciones de fechas igual
function getRelWeek(dateInput) {
    const d = (typeof dateInput === 'string') ? parseLocal(dateInput) : dateInput;
    const start = getStartDate();
    if (isNaN(d) || isNaN(start)) return 1;
    return Math.max(1, Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(start.getFullYear(), start.getMonth(), start.getDate())) / 604800000) + 1);
}

// ═══════════════════════════════════════════════════════
//  RENDER TABS (MODIFICADAS SEGÚN REQUERIMIENTOS)
// ═══════════════════════════════════════════════════════
function renderTasks() {
  const el = document.getElementById('tab-tasks');
  if (!el) return;
  const teamOpts = (state.team||[]).map(m => `<option value="${m.name}" ${filterAssignee===m.name?'selected':''}>${m.name}</option>`).join('');
  let html = `<div class="filter-bar"><select onchange="filterAssignee=this.value;renderTasks()"><option value="all">Todos los responsables</option>${teamOpts}<option value="unassigned" ${filterAssignee==='unassigned'?'selected':''}>Sin asignar</option></select><select onchange="filterStatus=this.value;renderTasks()"><option value="all">Todos los estados</option><option value="active" ${filterStatus==='active'?'selected':''}>Pendientes y En curso</option><option value="retrasado" ${filterStatus==='retrasado'?'selected':''}>Retrasados</option><option value="completado" ${filterStatus==='completado'?'selected':''}>Completados</option></select></div>`;

  STAGES.forEach(stage => {
    let fTasks = getAllTasks().filter(t => t.stageId===stage.id).filter(t => {
      let matchA = filterAssignee==='all' ? true : (filterAssignee==='unassigned' ? !t.assignee : t.assignee===filterAssignee);
      const st = getTaskStatus(t.id);
      let matchS = filterStatus==='all' ? true : (filterStatus==='active' ? (st==='pendiente'||st==='curso') : filterStatus===st);
      return matchA && matchS;
    }).sort((a,b) => getTaskDates(a).start - getTaskDates(b).start);
    
    if (fTasks.length===0) return;
    const done = fTasks.filter(t=>getTaskStatus(t.id)==='completado').length;
    const pct = fTasks.length ? Math.round(done/fTasks.length*100) : 0;
    const col = state.collapsed && state.collapsed[stage.id];
    
    html += `<div class="section"><div class="section-header" onclick="toggleSection(${stage.id})"><div class="section-title"><span style="width:10px;height:10px;border-radius:50%;background:${stage.color};display:inline-block"></span>${stage.name}</div><div class="section-meta"><span>${done}/${fTasks.length}</span><div class="pbar-sm"><div class="pbar-sm-inner" style="width:${pct}%;background:${stage.color}"></div></div><i class="ti ti-chevron-${col?'right':'down'}"></i></div></div>${col ? '' : renderTaskList(fTasks, stage)}</div>`;
  });
  el.innerHTML = html;
}

function renderTaskList(tasks, stage) {
  let html = '<div>';
  tasks.forEach(t => {
    const status = getTaskStatus(t.id);
    const { start, end } = getTaskDates(t);
    const dateLabel = `${fmtShort(start)} — ${fmtShort(end)} · S${getRelWeek(start)}`;
    const assigneeBadge = (t.assignee && typeof t.assignee==='string') ? `<span class="badge badge-tarea"><i class="ti ti-user"></i> ${t.assignee}</span>` : '';
    
    // Subtask Logic (Progress)
    const subs = state.subtasks && state.subtasks[t.id] ? state.subtasks[t.id] : [];
    let subProgHtml = '';
    if(subs.length > 0) {
        const dSub = subs.filter(s=>s.status==='completado').length;
        const pSub = Math.round((dSub/subs.length)*100);
        subProgHtml = `<span style="font-size:10px;color:var(--blue);margin-left:6px"><i class="ti ti-list-check"></i> ${dSub}/${subs.length}</span><div class="sub-prog-bar"><div class="sub-prog-inner" style="width:${pSub}%"></div></div>`;
    }

    html += `<div class="task-row${status==='completado'?' done':''}" onclick="openTask('${t.id}',${stage.id})">
      <div class="status-icon si-${status}" onclick="quickToggle(event,'${t.id}')">${getStatusIconHTML(status)}</div>
      <div class="task-info"><div class="task-name">${t.name}</div><div class="task-date"><i class="ti ti-calendar-event"></i> ${dateLabel} ${subProgHtml}</div></div>
      <div class="task-right">${assigneeBadge}${badge(t.type)}</div>
    </div>`;
    
    subs.forEach(s => {
      const sst = s.status||'pendiente';
      const sassg = s.assignee ? ` <i class="ti ti-user"></i> ${s.assignee.split(' ')[0]}` : '';
      html += `<div class="subtask-indented ${sst==='completado'?'done':''}" onclick="openTask('${t.id}',${stage.id})">
        <i class="ti ti-${sst==='completado'?'check':'corner-down-right'}" style="color:${sst==='completado'?'var(--green)':'var(--border2)'}; font-size:16px;"></i>
        <span class="st-name">${s.name}<span style="font-size:11px;color:var(--text3)"> ${sassg}</span></span>
      </div>`;
    });
  });
  html += `<div class="add-task-btn" onclick="openAddTask(${stage.id})"><i class="ti ti-plus"></i> Agregar actividad</div></div>`;
  return html;
}

function renderBoard() {
  const el = document.getElementById('tab-board');
  if (!el) return;
  const cols = { pendiente:[], curso:[], retrasado:[], completado:[] };
  getAllTasks().forEach(t => cols[getTaskStatus(t.id)].push(t));
  const colNames = { pendiente:['Pendientes','var(--border2)'], curso:['En Curso','var(--blue)'], retrasado:['Retrasadas','var(--red)'], completado:['Completadas','var(--green)'] };
  
  let html = '<div class="board-container">';
  ['pendiente','curso','retrasado','completado'].forEach(k => {
    html += `<div class="board-col"><h3 style="border-color:${colNames[k][1]}">${colNames[k][0]} <span style="color:var(--text3);font-size:11px">${cols[k].length}</span></h3>`;
    cols[k].forEach(t => {
      const subs = state.subtasks&&state.subtasks[t.id] ? state.subtasks[t.id] : [];
      const subsDone = subs.filter(s=>s.status==='completado').length;
      
      let subMeta = '';
      if(subs.length > 0) {
          const pSub = Math.round((subsDone/subs.length)*100);
          subMeta = `<div style="display:flex;align-items:center;gap:4px;margin-top:6px;"><span style="color:var(--blue);font-size:10px;"><i class="ti ti-list-check"></i> ${subsDone}/${subs.length}</span><div class="sub-prog-bar"><div class="sub-prog-inner" style="width:${pSub}%"></div></div></div>`;
      }
      
      const assg = t.assignee ? `<i class="ti ti-user"></i> ${t.assignee.split(' ')[0]}` : '';
      html += `<div class="board-card" style="border-left-color:${t.stageColor}" onclick="openTask('${t.id}',${t.stageId})">
        <div class="bc-title">${t.name}</div>
        <div class="bc-meta"><span>${badge(t.type)} ${assg}</span></div>
        ${subMeta}
      </div>`;
    });
    html += `</div>`;
  });
  el.innerHTML = html + '</div>';
}

function renderGantt() {
  const el = document.getElementById('tab-gantt');
  if (!el) return;
  const meta = currentProjId ? allProjects[currentProjId].meta : {};
  const TOTAL_W = meta.totalWeeks || 35; const TOTAL_D = TOTAL_W * 7;
  const projStart = getStartDate(); const tf = todayFraction();
  
  let monthsHtml = ''; let currentM = ''; let wCount = 0;
  for (let w = 1; w <= TOTAL_W; w++) {
      const date = weekStart(w);
      const mStr = date.toLocaleDateString('es-CL', { month: 'short', year: '2-digit' }).replace(' de ', ' '); 
      if (mStr !== currentM) {
          if (wCount > 0) monthsHtml += `<div class="month-col" style="flex:${wCount};">${currentM}</div>`;
          currentM = mStr; wCount = 1;
      } else wCount++;
  }
  if (wCount > 0) monthsHtml += `<div class="month-col" style="flex:${wCount};">${currentM}</div>`;

  let html = `<div class="gantt-wrap"><div class="gantt-inner">
    <div class="gantt-head-row"><div>Actividad</div><div class="month-labels">${monthsHtml}</div></div>`;

  STAGES.forEach(stage => {
    let stageTasks = getAllTasks().filter(t=>t.stageId===stage.id).sort((a,b)=>getTaskDates(a).start-getTaskDates(b).start);
    if (!stageTasks.length) return;
    const scol = state.ganttCollapsed && state.ganttCollapsed[stage.id];
    
    let stageBarHtml = `<div></div>`;
    let minS = Infinity, maxE = -Infinity;
    stageTasks.forEach(t => {
        const {start, end} = getTaskDates(t);
        if(!isNaN(start) && start.getTime() < minS) minS = start.getTime();
        if(!isNaN(end) && end.getTime() > maxE) maxE = end.getTime();
    });
    if(minS !== Infinity && maxE !== -Infinity) {
        const sD = Math.floor((minS - projStart.getTime())/(24*3600*1000));
        const eD = Math.floor((maxE - projStart.getTime())/(24*3600*1000));
        stageBarHtml = `<div class="gantt-bar-cell"><div class="gantt-bar" style="left:${Math.max(0, (sD/TOTAL_D)*100)}%;width:${Math.max(0.5, ((eD - sD + 1)/TOTAL_D)*100)}%;background:${stage.color};opacity:0.25;border-radius:4px"></div></div>`;
    }

    html += `<div class="gantt-row" style="background:${stage.light}; cursor:pointer" onclick="toggleGanttSection(${stage.id})">
      <div style="font-weight:600; font-size:12px; display:flex; align-items:center; gap:6px; z-index:3; color:${stage.color}"><i class="ti ti-chevron-${scol?'right':'down'}" style="font-size:14px"></i><span style="width:8px;height:8px;border-radius:50%;background:${stage.color};display:inline-block"></span>${stage.name}</div>
      ${stageBarHtml}
    </div>`;
    
    if (!scol) {
      stageTasks.forEach(t => {
        const status = getTaskStatus(t.id);
        const { start, end } = getTaskDates(t);
        const startD = Math.floor((start - projStart)/(24*3600*1000));
        const endD = Math.floor((end - projStart)/(24*3600*1000));
        const barColor = status==='completado'?'var(--green)': status==='retrasado'?'var(--red)': status==='curso'?'var(--blue)':stage.color;
        
        html += `<div class="gantt-row" style="cursor:pointer" onclick="openTask('${t.id}',${stage.id})">
          <div style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:8px;color:${status==='completado'?'var(--text3)':'var(--text)'}${status==='completado'?';text-decoration:line-through':''}">${t.name}</div>
          <div class="gantt-bar-cell">
            <div class="gantt-today-line" style="left:${tf*100}%"></div>
            <div class="gantt-bar" style="left:${Math.max(0,(startD/TOTAL_D)*100)}%; width:${Math.max(.5,((endD-startD+1)/TOTAL_D)*100)}%; background:${barColor}; ${status==='completado'?';opacity:.5':''}"></div>
          </div>
        </div>`;
      });
    }
  });
  el.innerHTML = html + '</div></div>';
}

function renderShare(){
    const el = document.getElementById('tab-share');
    if(!el) return;
    el.innerHTML=`<div style="margin-bottom:14px"><p style="font-size:13px;color:var(--text2);margin-bottom:12px">¡La base de datos en tiempo real de Firebase está activada!</p><button class="btn btn-blue" onclick="copyShareMsg()"><i class="ti ti-copy"></i> Copiar resumen para equipo</button></div>`;
}

function copyShareMsg(){
    const s = calcStats(); const cw = currentWeek(); const nm = getNextUpcoming('hito'); const np = getNextUpcoming('producto');
    let hitoText = nm.item ? `${nm.item.name} (en ${nm.days} días)` : "Ninguno pendiente";
    const meta = allProjects[currentProjId].meta;
    const text = `📊 ${meta.name}\nSemana actual: S${cw} (${fmtShort(weekStart(cw))} – ${fmtShort(weekEnd(cw))})\nProgreso: ${s.pct}% (${s.done}/${s.total} actividades completadas)\n- Completadas: ${s.counts.completado}\n- En curso: ${s.counts.curso}\n- Pendientes: ${s.counts.pendiente}\n- Retrasadas: ${s.counts.retrasado}\nProductos: ${s.productsDone}/${s.products} entregados\nPróximo hito: ${hitoText}\nGenerado: ${fmtDate(new Date())} a las ${new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}`;
    navigator.clipboard.writeText(text).then(()=>alert('Resumen copiado al portapapeles ✓'));
}

// ── MODAL DE TAREA / SUBTAREAS ────────────────────────────────
function openTask(taskId, stageId) {
  const t = getAllTasks().find(x=>x.id===taskId);
  if(!t) return;
  const stage = STAGES.find(s=>s.id===stageId)||{color:'#ccc'};
  const status = getTaskStatus(taskId);
  const { start, end } = getTaskDates(t);
  const note = state.notes[taskId]||'';
  
  const teamOpts = (state.team||[]).map(m=>`<option value="${m.name}" ${t.assignee===m.name?'selected':''}>${m.name}</option>`).join('');
  const gcalLink = generateGCalLink(t);

  let evalSection = '';
  if(t.type === 'producto') {
      const ev = state.evaluations[taskId]||0;
      evalSection = `<div style="background:var(--green-light);border:1px solid var(--green);border-radius:var(--radius);padding:12px;margin-bottom:12px"><label style="color:var(--green);"><i class="ti ti-star-filled"></i> Autoevaluación del Equipo</label><div class="stars-input"><div>${[1,2,3,4,5].map(i=>`<button class="star-btn ${ev>=i?'on-green':''}" onclick="setEvM('${taskId}',${i},false)">★</button>`).join('')}</div><span style="font-size:11px;color:var(--green);margin-left:12px;cursor:pointer;text-decoration:underline" onclick="setEvM('${taskId}',0,false)">Desmarcar</span></div></div>`;
  } else if(t.type === 'revision') {
      const evC = state.evaluationsClient[taskId]||0;
      evalSection = `<div style="background:var(--amber-light);border:1px solid var(--amber);border-radius:var(--radius);padding:12px;margin-bottom:12px"><label style="color:#a87000;"><i class="ti ti-building-bank"></i> Feedback del Cliente (JUNAEB)</label><div class="stars-input"><div>${[1,2,3,4,5].map(i=>`<button class="star-btn ${evC>=i?'on':''}" onclick="setEvM('${taskId}',${i},true)">★</button>`).join('')}</div><span style="font-size:11px;color:#a87000;margin-left:12px;cursor:pointer;text-decoration:underline" onclick="setEvM('${taskId}',0,true)">Desmarcar</span></div></div>`;
  }

  const subs = state.subtasks[taskId] || [];
  let subsHTML = `<div class="modal-subtasks"><label><i class="ti ti-list-check"></i> Desglose y Subtareas</label>`;
  subs.forEach(s => {
      const sTeam = (state.team||[]).map(m=>`<option value="${m.name}" ${s.assignee===m.name?'selected':''}>${m.name}</option>`).join('');
      subsHTML += `<div class="sub-row">
          <i class="ti ti-${s.status==='completado'?'check':'circle'}" style="color:${s.status==='completado'?'var(--green)':'var(--border2)'};font-size:20px;cursor:pointer;" onclick="toggleSubM('${taskId}','${s.id}')"></i>
          <input type="text" value="${(s.name||'').replace(/"/g, '&quot;')}" onchange="updateSubM('${taskId}','${s.id}','name',this.value)" placeholder="Descripción..."/>
          <select onchange="updateSubM('${taskId}','${s.id}','assignee',this.value)">
              <option value="" disabled hidden ${!s.assignee?'selected':''}>Responsable...</option>
              <option value="">Sin asignar</option>
              ${sTeam}
          </select>
          <input type="date" value="${s.date||''}" onchange="updateSubM('${taskId}','${s.id}','date',this.value)"/>
          <i class="ti ti-trash" onclick="deleteSubM('${taskId}','${s.id}')" style="cursor:pointer;color:var(--red);font-size:16px;margin-left:4px;"></i>
      </div>`;
  });
  subsHTML += `<div class="sub-row" style="margin-top:8px"><i class="ti ti-plus" style="color:var(--text3);padding:0 4px;"></i><input type="text" id="new-sub-name" placeholder="Escribe una nueva subtarea..."/><button class="btn btn-primary btn-sm" onclick="addSubM('${taskId}')">Agregar</button></div></div>`;

  modal(`
    <h3 style="margin-bottom:4px">${t.name}</h3>
    <div style="display:flex;gap:6px;margin-bottom:14px">${badge(t.type)}</div>
    <div class="form-row"><label>Responsable</label><select id="modal-assignee"><option value="">Sin asignar</option>${teamOpts}</select></div>
    <div class="form-row"><label>Fechas</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="modal-start" type="date" value="${!isNaN(start)?toYMD(start):''}"/><input id="modal-end" type="date" value="${!isNaN(end)?toYMD(end):''}"/></div></div>
    <div class="form-row"><a href="${gcalLink}" target="_blank" class="btn" style="width:100%;justify-content:center;border-color:var(--blue);color:var(--blue)"><i class="ti ti-calendar-plus"></i> Agregar a Google Calendar</a></div>
    
    <div class="form-row" style="margin-top:16px">
      <label>Estado</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn${status==='pendiente'?' btn-primary':''}" id="btn-st-pendiente" onclick="setStM('${taskId}','pendiente')"><i class="ti ti-circle"></i> Pendiente</button>
        <button class="btn${status==='curso'?' btn-blue':''}" id="btn-st-curso" onclick="setStM('${taskId}','curso')"><i class="ti ti-player-play"></i> En curso</button>
        <button class="btn${status==='retrasado'?' btn-red':''}" id="btn-st-retrasado" onclick="setStM('${taskId}','retrasado')"><i class="ti ti-alert-circle"></i> Retrasado</button>
        <button class="btn${status==='completado'?' btn-primary':''}" id="btn-st-completado" onclick="setStM('${taskId}','completado')"><i class="ti ti-circle-check"></i> Completado</button>
      </div>
    </div>
    
    ${subsHTML}${evalSection}
    <div class="form-row"><label>Notas</label><textarea id="modal-note">${note}</textarea></div>
    <div class="modal-actions" style="justify-content:space-between"><button class="btn btn-danger" style="border:none;background:transparent" onclick="deleteTaskModal('${taskId}')"><i class="ti ti-trash"></i> Eliminar</button><div style="display:flex;gap:8px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveTaskModal('${taskId}')">Guardar</button></div></div>
  `);
}

function toggleSubM(pId, sId) {
  const sub = state.subtasks[pId].find(s=>s.id===sId);
  if(sub) {
      sub.status = sub.status==='completado'?'pendiente':'completado';
      // Lógica inteligente: Si todas están completadas, completar la tarea madre.
      const allDone = state.subtasks[pId].every(s => s.status === 'completado');
      if(allDone) {
          state.statuses[pId] = 'completado';
          logAction(`Tarea madre completada automáticamente (Subtareas finalizadas).`);
      }
      saveState(); openTask(pId, getAllTasks().find(t=>t.id===pId).stageId);
  }
}

// Conserva las funciones originales necesarias que se acortaron arriba por espacio (setStM, addSubM, etc) idénticas a versiones previas funcionales.
function setStM(id, val) { state.statuses[id] = val; ['pendiente','curso','retrasado','completado'].forEach(st => { const b = document.getElementById('btn-st-'+st); if (b) b.className = 'btn'; }); const b = document.getElementById('btn-st-'+val); if (b) b.className = val==='curso'?'btn btn-blue':(val==='retrasado'?'btn btn-red':'btn btn-primary'); }
function addSubM(pId) { const name = document.getElementById('new-sub-name').value.trim(); if (!name) return; if (!state.subtasks) state.subtasks = {}; if (!state.subtasks[pId]) state.subtasks[pId] = []; state.subtasks[pId].push({ id:'sub'+Date.now(), name, status:'pendiente', assignee:'', date:'' }); saveState(); openTask(pId, getAllTasks().find(t=>t.id===pId).stageId); }
function updateSubM(pId, sId, f, v) { const sub = state.subtasks[pId].find(s=>s.id===sId); if (sub) { sub[f]=v; saveState(); } }
function deleteSubM(pId, sId) { state.subtasks[pId] = state.subtasks[pId].filter(s=>s.id!==sId); saveState(); openTask(pId, getAllTasks().find(t=>t.id===pId).stageId); }
function setEvM(id, val, isC) { if (isC) { if(!state.evaluationsClient) state.evaluationsClient={}; if(state.evaluationsClient[id]===val) val=0; state.evaluationsClient[id]=val; document.querySelectorAll('#modal-stars-client .star-btn').forEach((b,i)=>b.className='star-btn'+(val>=i+1?' on':'')); } else { if(!state.evaluations) state.evaluations={}; if(state.evaluations[id]===val) val=0; state.evaluations[id]=val; document.querySelectorAll('#modal-stars .star-btn').forEach((b,i)=>b.className='star-btn'+(val>=i+1?' on-green':'')); } }
function saveTaskModal(id) { const start=document.getElementById('modal-start').value; const end=document.getElementById('modal-end').value; const assg=document.getElementById('modal-assignee').value; if(!state.taskOverrides) state.taskOverrides={}; state.taskOverrides[id]={startDate:start,endDate:end,assignee:assg}; if(state.customTasks){ const ct=state.customTasks.find(x=>x.id===id); if(ct){ct.startDate=start;ct.endDate=end;ct.assignee=assg;} } if(!state.notes) state.notes={}; state.notes[id]=document.getElementById('modal-note').value; saveState(); closeModal(); }
function deleteTaskModal(id) { if(!confirm('¿Eliminar actividad?')) return; if(!state.deletedIds) state.deletedIds=[]; state.deletedIds.push(id); saveState(); closeModal(); }
</script>
