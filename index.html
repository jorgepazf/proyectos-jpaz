let tcFilterPerson = 'all';
let tcFilterProject = 'all';
let tcFilterStatus = 'all';

async function showTeamCalendar() {
  showScreen('team-calendar');
  document.getElementById('team-cal-content').innerHTML = `<div style="text-align:center;padding:40px;color:var(--text3)"><div class="spinner" style="margin:0 auto 10px"></div>Cargando actividades...</div>`;
  
  // Load all projects states
  try {
    const snap = await db.collection('projects').get();
    const projects = {};
    const statePromises = [];
    snap.forEach(doc => { projects[doc.id] = { meta: doc.data(), state: {} }; });
    
    const ids = Object.keys(projects);
    for (const id of ids) {
      try {
        const stateDoc = await db.collection('projects').doc(id).collection('runtime').doc('state').get();
        if (stateDoc.exists) projects[id].state = stateDoc.data();
      } catch(e) {}
    }
    renderTeamCalendar(projects);
  } catch(e) {
    document.getElementById('team-cal-content').innerHTML = `<p style="color:var(--red)">Error al cargar datos.</p>`;
  }
}

function renderTeamCalendar(projects) {
  // Collect all tasks with person + project info
  const allItems = [];
  const allPersons = new Set();
  const allProjNames = {};

  Object.entries(projects).forEach(([pid, proj]) => {
    if (proj.meta.archived) return;
    const meta = proj.meta;
    const st   = proj.state;
    allProjNames[pid] = meta.name;
    
    if (!meta.stages) return;
    const palette = STAGE_PALETTE;
    const stages = (meta.stages||[]).map((s,i)=>({...s, color:palette[i%palette.length].color}));
    const startDate = st.startDate || meta.startDate || '';
    
    const getAllTasksForProj = () => {
      const all = [];
      stages.forEach(s => (s.tasks||[]).forEach(t => {
        if (st.deletedIds && st.deletedIds.includes(t.id)) return;
        const ov = st.taskOverrides && st.taskOverrides[t.id];
        all.push({...t, stageId:s.id, stageColor:s.color, ...(ov||{})});
      }));
      (st.customTasks||[]).forEach(t => {
        if (st.deletedIds && st.deletedIds.includes(t.id)) return;
        const ov = st.taskOverrides && st.taskOverrides[t.id];
        all.push({...t, ...(ov||{})});
      });
      return all;
    };
    
    const getDateForProj = (t) => {
      const parseL = ds => { if(!ds) return new Date(); const p=ds.split('T')[0].split('-'); return new Date(p[0],p[1]-1,p[2]); };
      const wStart = w => { const d=new Date(parseL(startDate)); d.setDate(d.getDate()+(w-1)*7); return d; };
      const wEnd   = w => { const d=wStart(w); d.setDate(d.getDate()+6); return d; };
      const s = t.startDate ? parseL(t.startDate) : wStart(t.weeks?t.weeks[0]:(t.week||1));
      const e = t.endDate   ? parseL(t.endDate)   : wEnd(t.weeks?t.weeks[1]:(t.week||1));
      return {start:s, end:e};
    };
    
    getAllTasksForProj().forEach(t => {
      const assignee = t.assignee || '';
      const status = (st.statuses&&st.statuses[t.id]) || 'pendiente';
      const {start,end} = getDateForProj(t);
      if (assignee) allPersons.add(assignee);
      allItems.push({ taskId:t.id, name:t.name, assignee, status, start, end, projId:pid, projName:meta.name, type:t.type, stageColor:t.stageColor||'#ccc' });
    });
  });

  const persons = Array.from(allPersons).sort();
  const personColors = {};
  persons.forEach((p,i)=>{ personColors[p]=STAGE_PALETTE[i%STAGE_PALETTE.length].color; });
  
  // Build filter UI
  const personChips = `<button class="filter-chip ${tcFilterPerson==='all'?'active':''}" onclick="tcFilterPerson='all';applyTCFilters()">Todos</button>`
    + persons.map(p=>`<button class="filter-chip ${tcFilterPerson===p?'active':''}" onclick="tcFilterPerson='${p.replace(/'/g,"\\'")}';applyTCFilters()" style="${tcFilterPerson===p?'':'border-left:3px solid '+personColors[p]}">
      <span class="member-dot" style="background:${personColors[p]}"></span> ${p}
    </button>`).join('');
  
  const projIds = Object.keys(allProjNames);
  const projChips = `<button class="filter-chip ${tcFilterProject==='all'?'active':''}" onclick="tcFilterProject='all';applyTCFilters()">Todos los proyectos</button>`
    + projIds.map(id=>`<button class="filter-chip ${tcFilterProject===id?'active':''}" onclick="tcFilterProject='${id}';applyTCFilters()">${allProjNames[id]}</button>`).join('');

  const statusChips = ['all','pendiente','curso','retrasado','completado'].map(s=>
    `<button class="filter-chip ${tcFilterStatus===s?'active':''}" onclick="tcFilterStatus='${s}';applyTCFilters()">${s==='all'?'Todos los estados':s.charAt(0).toUpperCase()+s.slice(1)}</button>`
  ).join('');

  // Filter items
  let filtered = allItems.filter(item => {
    if (tcFilterPerson!=='all' && item.assignee!==tcFilterPerson) return false;
    if (tcFilterProject!=='all' && item.projId!==tcFilterProject) return false;
    if (tcFilterStatus!=='all' && item.status!==tcFilterStatus) return false;
    return true;
  }).sort((a,b)=>a.end-b.end);

  const today = new Date(); today.setHours(0,0,0,0);
  const fmtD = d => { if(!d||isNaN(d)) return '—'; return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}); };

  let taskRows = '';
  if (filtered.length === 0) {
    taskRows = `<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">No hay actividades que coincidan con los filtros.</div>`;
  } else {
    // Group by person
    const grouped = {};
    filtered.forEach(item => {
      const key = item.assignee || 'Sin asignar';
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(item);
    });
    
    Object.entries(grouped).forEach(([person, items]) => {
      const color = personColors[person] || 'var(--text3)';
      taskRows += `<div style="background:var(--bg2);padding:8px 14px;font-size:12px;font-weight:600;color:${color};border-top:2px solid ${color};display:flex;align-items:center;gap:6px">
        <span class="member-dot" style="background:${color}"></span>${person} <span style="font-weight:400;color:var(--text3);font-size:11px">(${items.length} actividades)</span>
      </div>`;
      items.forEach(item => {
        const overdue = item.status!=='completado' && item.end < today;
        const endColor = overdue ? 'var(--red)' : 'var(--text2)';
        taskRows += `<div class="cal-task-row">
          <span class="member-dot" style="background:${item.stageColor}"></span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.name}</div>
            <div style="font-size:11px;color:var(--text3)">${item.projName}</div>
          </div>
          <div style="font-size:11px;color:${endColor};white-space:nowrap;min-width:90px;text-align:right">${fmtD(item.end)}</div>
          <span class="pill-status pill-${item.status}">${item.status}</span>
        </div>`;
      });
    });
  }

  // Stats summary
  const byPerson = {};
  persons.forEach(p => {
    const mine = allItems.filter(i=>i.assignee===p);
    byPerson[p] = { total:mine.length, done:mine.filter(i=>i.status==='completado').length, delayed:mine.filter(i=>i.status==='retrasado').length };
  });
  
  let teamSummary = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px">`;
  persons.forEach(p => {
    const color = personColors[p]||'var(--green)';
    const d = byPerson[p];
    const pct = d.total>0?Math.round(d.done/d.total*100):0;
    teamSummary += `<div class="stat-card" style="border-left:3px solid ${color}">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span class="member-dot" style="background:${color}"></span><span style="font-size:12px;font-weight:600">${p}</span></div>
      <div style="font-size:20px;font-weight:700">${d.total}</div>
      <div style="font-size:11px;color:var(--text3)">${d.done} completadas · ${d.delayed} retrasadas</div>
      <div style="height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${color}"></div></div>
    </div>`;
  });
  teamSummary += `</div>`;

  document.getElementById('team-cal-content').innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Por persona</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${personChips}</div>
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 8px">Por proyecto</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${projChips}</div>
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 8px">Por estado</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${statusChips}</div>
    </div>
    ${teamSummary}
    <div style="border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden">
      <div style="background:var(--bg2);padding:8px 14px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;display:grid;grid-template-columns:1fr 100px 90px;gap:10px">
        <span>Actividad / Proyecto</span><span style="text-align:right">Fecha fin</span><span>Estado</span>
      </div>
      ${taskRows}
    </div>`;
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
loadProjectList();

</script>
</body>
</html>
