<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Proyectos Jorge Paz</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f6f7f8;--bg3:#f0f1f3;
  --text:#111;--text2:#555;--text3:#999;
  --border:#e0e0e0;--border2:#ccc;
  --green:#1D9E75;--green-light:#E1F5EE;
  --blue:#378ADD;--blue-light:#E6F1FB;
  --orange:#D85A30;--orange-light:#FAECE7;
  --purple:#7F77DD;--purple-light:#EEEDFE;
  --amber:#EF9F27;--amber-light:#FAEEDA;
  --red:#d63939;--red-light:#fdebeb;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a1a;--bg2:#242424;--bg3:#2c2c2c;
    --text:#f0f0f0;--text2:#aaa;--text3:#666;
    --border:#333;--border2:#444;
    --green-light:#0a3326;--blue-light:#0a1e35;
    --orange-light:#3a1a0a;--purple-light:#1a1845;
    --amber-light:#3a2500;--red-light:#3d1010;
  }
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    opacity: 0.8;
    cursor: pointer;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* ── LOADING & ERRORS ── */
#loading-overlay{position:fixed;inset:0;background:var(--bg);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:var(--bg);padding:24px;border-radius:var(--radius-lg);border:1px solid var(--red);max-width:420px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.1)}

/* ── LAYOUT COMMON ── */
.screen{display:none;max-width:1100px;margin:0 auto;padding:20px 16px}
.screen.active{display:block}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:34px;height:34px;border-radius:var(--radius);background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.brand h1{font-size:16px;font-weight:600;color:var(--text)}
.brand p{font-size:11px;color:var(--text3);margin-top:1px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── BUTTONS ── */
.btn{padding:7px 14px;border-radius:var(--radius);font-size:13px;cursor:pointer;border:1px solid var(--border2);background:var(--bg);color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:background .15s;text-decoration:none;position:relative}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-primary:hover{background:#0f6e56;color:#fff}
.btn-danger{color:#c00;border-color:#fcc}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}

/* ── PROJECT CARDS ── */
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:10px;display:flex;justify-content:space-between}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:24px}
.project-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;position:relative;overflow:visible}
.project-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);border-color:var(--border2)}
.project-card.archived{opacity:0.6; filter: grayscale(30%);}
.project-card.archived:hover{opacity:1; filter: grayscale(0%);}
.pc-accent{position:absolute;top:0;left:0;right:0;height:3px}
.pc-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;margin-top:6px;line-height:1.3;padding-right:20px;}
.pc-client{font-size:12px;color:var(--text2);margin-bottom:12px}
.pc-meta{display:flex;gap:12px;font-size:11px;color:var(--text3)}
.pc-pbar{height:4px;background:var(--border);border-radius:2px;margin-top:10px;overflow:hidden}
.pc-pbar-inner{height:100%;border-radius:2px}
.pc-type-badge{position:absolute;top:14px;right:34px;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge-propuesta{background:var(--amber-light);color:#8a5c00}
.badge-proyecto{background:var(--green-light);color:var(--green)}
.badge-perdida{background:var(--red-light);color:var(--red)}
.badge-finalizado{background:var(--bg3);color:var(--text2)}
.new-card{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:130px;color:var(--text3)}
.new-card:hover{border-color:var(--green);background:var(--green-light);color:var(--green)}

/* 3 dots menu */
.pc-menu-btn{position:absolute;top:10px;right:6px;width:24px;height:24px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-radius:4px;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background 0.1s}
.pc-menu-btn:hover{background:var(--bg2);color:var(--text)}
.pc-dropdown{display:none;position:absolute;top:38px;right:6px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 6px 16px rgba(0,0,0,.15);z-index:20;min-width:180px;overflow:hidden}
.pc-dropdown.show{display:block}
.pc-dd-item{padding:10px 14px;font-size:13px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px;}
.pc-dd-item:hover{background:var(--bg2)}
.pc-dd-danger{color:var(--red); border-top:1px solid var(--border);}

/* ── TABS ── */
.tab-row{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0;overflow-x:auto;scrollbar-width:none;}
.tab-row::-webkit-scrollbar{display:none;}
.tab{padding:8px 16px;border-radius:var(--radius) var(--radius) 0 0;font-size:13px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text2);margin-bottom:-1px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tab.active{background:var(--bg);border-color:var(--border);border-bottom-color:var(--bg);color:var(--text);font-weight:500}

/* ── STATS & PROGRESS ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--border)}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:600;color:var(--text)}
.stat-sub{font-size:11px;color:var(--text3);margin-top:2px}
.week-progress{background:var(--bg2);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;border:1px solid var(--border)}
.week-progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px}
.pbar-outer{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.pbar-inner{height:100%;background:var(--green);border-radius:4px;transition:width .4s}

/* ── TASK LIST ── */
.section{margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg2);cursor:pointer;gap:10px}
.section-title{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;flex:1}
.pbar-sm{width:70px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.pbar-sm-inner{height:100%;border-radius:3px}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:8px 14px;border-top:1px solid var(--border);cursor:pointer;transition:background .12s}
.task-row:hover{background:var(--bg2)}
.task-row.done .task-name{text-decoration:line-through;color:var(--text3)}
.status-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.si-pendiente{color:var(--border2)}.si-curso{color:var(--blue)}.si-retrasado{color:var(--red)}.si-completado{color:var(--green)}
.task-info{flex:1;min-width:0}
.task-name{font-size:13px;color:var(--text);line-height:1.4}
.task-right{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-producto{background:var(--blue-light);color:var(--blue)}
.badge-revision{background:var(--amber-light);color:#8a5c00}
.badge-hito{background:#fff0f0;color:#c00}
.badge-tarea{background:var(--bg3);color:var(--text2)}
.add-task-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;font-size:12px;color:var(--text2);cursor:pointer;border-top:1px dashed var(--border)}

/* ── SUBTASKS ── */
.subtask-indented{padding:6px 14px 6px 44px;background:var(--bg);border-top:1px dashed var(--border);display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}
.subtask-indented:hover{background:var(--bg2)}
.subtask-indented.done .st-name{text-decoration:line-through;color:var(--text3)}
.modal-subtasks{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.sub-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border)}
.sub-row:last-child{border-bottom:none}
.sub-row input[type="text"]{flex:1;background:var(--bg);border:1px solid var(--border2);padding:6px 8px;font-size:12px;border-radius:4px;outline:none}
.sub-row input[type="date"]{width:110px;background:var(--bg);border:1px solid var(--border2);padding:6px;font-size:11px;border-radius:4px;outline:none}
.sub-row select{width:130px;background:var(--bg);border:1px solid var(--border2);padding:6px;font-size:11px;border-radius:4px;outline:none; cursor:pointer;}
.sub-prog-bar{height:4px;background:var(--border);border-radius:2px;width:60px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.sub-prog-inner{height:100%;background:var(--blue)}

/* ── KANBAN ── */
.board-container{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.board-col{flex:1;min-width:240px;background:var(--bg2);border-radius:var(--radius-lg);padding:12px;border:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.board-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;border-left:4px solid var(--border2)}

/* ── GANTT ── */
.gantt-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg)}
.gantt-inner{min-width:820px}
.gantt-head-row{display:grid;grid-template-columns:300px 1fr;font-size:11px;color:var(--text2);padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
/* MEJORA 1: Cursor Manito y no Texto en Gantt */
.gantt-row{display:grid;grid-template-columns:300px 1fr;align-items:center;padding:5px 14px;border-top:1px solid var(--border);font-size:12px;position:relative;cursor:pointer;user-select:none;}
.gantt-row:hover{background:var(--bg2)!important}
.gantt-row > div {cursor:pointer;user-select:none;}
.gantt-bar-cell{position:relative;height:14px;width:100%}
.gantt-bar{position:absolute;height:100%;border-radius:3px;z-index:1;pointer-events:none;}
.gantt-today-line{position:absolute;top:0;width:2px;height:100%;background:rgba(216,90,48,.8);z-index:10;pointer-events:none}
.month-labels{display:flex;font-size:10px;color:var(--text3);height:100%;align-items:center;}
.month-col{flex:1;text-align:center;border-left:1px solid var(--border2);height:100%;display:flex;align-items:center;justify-content:center;font-weight:600;}

/* ── NOTIFICATIONS & MODALS ── */
.dropdown{position:relative;display:inline-block}
.notif-badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:white;font-size:10px;font-weight:bold;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;z-index:10}
.dropdown-content{display:none;position:absolute;right:0;top:100%;margin-top:8px;width:280px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:9999;overflow:hidden}
.dropdown-content.show{display:block}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text);line-height:1.4;background:var(--bg)}
.notif-item:last-child{border-bottom:none}
.notif-time{font-size:10px;color:var(--text3);margin-top:4px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px}
.modal{background:var(--bg);border-radius:var(--radius-lg);border:1px solid var(--border2);padding:20px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.form-row{margin-bottom:12px}
.form-row label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;font-weight:500}
.form-row input,.form-row textarea,.form-row select{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;background:var(--bg);color:var(--text);outline:none}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--green)}
.modal-actions{display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.eval-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:10px}
.eval-card h4{font-size:13px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.stars-input{display:flex;gap:4px}
.star-btn{font-size:22px;cursor:pointer;color:var(--border2);background:none;border:none;padding:0;line-height:1}
.star-btn.on{color:var(--amber)}.star-btn.on-green{color:var(--green)}
.tag-active{background:var(--green-light);color:var(--green);font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.import-area{border:2px dashed var(--border2);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;background:var(--bg2)}
.import-area:hover{border-color:var(--green)}

/* Share Text Box */
.share-preview-box { background:var(--bg2); padding:16px; border-radius:var(--radius); border:1px solid var(--border); font-family:monospace; font-size:12px; white-space:pre-wrap; margin-bottom:14px; color:var(--text); line-height:1.6; }

/* Global Tasks List */
.gt-row {display:flex; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border); gap:12px; background:var(--bg);}
.gt-row:hover {background:var(--bg2);}
.gt-proj {font-size:11px; color:var(--text3); font-weight:600;}

@media(max-width:600px){
  .topbar{flex-direction:column}
  .stats{grid-template-columns:1fr 1fr}
  .tab{padding:6px 10px;font-size:12px}
  .gantt-row, .gantt-head-row {grid-template-columns: 240px 1fr;}
}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p style="color:var(--text2)">Conectando a Firebase...</p>
</div>

<div id="screen-home" class="screen active">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon"><i class="ti ti-layout-dashboard"></i></div>
      <div>
        <h1>Mis Proyectos</h1>
        <p>Sistema de gestión de consultoría · Proyectos Jorge Paz</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="openGlobalTasks()"><i class="ti ti-list"></i> Visión Global</button>
      <button class="btn btn-primary" onclick="openNewProjectModal()"><i class="ti ti-plus"></i> Nuevo proyecto</button>
    </div>
  </div>
  <div id="home-projects-list"></div>
</div>

<div id="screen-project" class="screen">
  <div class="proj-topbar">
    <div class="proj-title-area">
      <h1 id="proj-title">—</h1>
      <p id="proj-subtitle">—</p>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="goHome()"><i class="ti ti-arrow-left"></i> Panel Principal</button>
      <div class="dropdown">
        <button class="btn" onclick="toggleNotifs(event)"><i class="ti ti-bell"></i> Historial</button>
        <span class="notif-badge" id="notif-badge" style="display:none">0</span>
        <div class="dropdown-content" id="notif-dropdown">
          <div style="padding:10px 14px;font-size:12px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);background:var(--bg2)">Últimos movimientos</div>
          <div id="notif-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="week-progress-bar"></div>
  <div class="stats" id="stats-bar"></div>

  <div class="tab-row">
    <button class="tab active" onclick="setTab('tasks',this)"><i class="ti ti-list-check"></i> Actividades</button>
    <button class="tab" onclick="setTab('gantt',this)"><i class="ti ti-chart-gantt"></i> Gantt</button>
    <button class="tab" onclick="setTab('board',this)"><i class="ti ti-layout-kanban"></i> Tablero</button>
    <button class="tab" onclick="setTab('eval',this)"><i class="ti ti-star"></i> Evaluaciones</button>
    <button class="tab" onclick="setTab('team',this)"><i class="ti ti-users"></i> Equipo</button>
    <button class="tab" onclick="setTab('share',this)"><i class="ti ti-share"></i> Publicar</button>
    <button class="tab" onclick="setTab('config',this)"><i class="ti ti-settings"></i> Config</button>
  </div>

  <div id="tab-tasks"></div>
  <div id="tab-gantt"  style="display:none"></div>
  <div id="tab-board" style="display:none"></div>
  <div id="tab-eval"  style="display:none"></div>
  <div id="tab-team"  style="display:none"></div>
  <div id="tab-share" style="display:none"></div>
  <div id="tab-config" style="display:none"></div>
</div>

<div id="screen-global" class="screen">
  <div class="proj-topbar">
    <div class="proj-title-area">
      <h1>Visión Global de Tareas</h1>
      <p>Todas las actividades de todos los proyectos activos</p>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="goHome()"><i class="ti ti-arrow-left"></i> Volver al panel</button>
    </div>
  </div>
  <div class="filter-bar" id="global-filters"></div>
  <div class="section" id="global-tasks-list"></div>
</div>

<div id="modal-root"></div>

<script>
// ═══════════════════════════════════════════════════════
//  FIREBASE CONFIGURATION
// ═══════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyBmh1KNxCs7-eM8OSx6uHjxbIwwEgH_ju4",
  authDomain:        "proyectos-jpaz.firebaseapp.com",
  projectId:         "proyectos-jpaz",
  storageBucket:     "proyectos-jpaz.firebasestorage.app",
  messagingSenderId: "656956112515",
  appId:             "1:656956112515:web:bea06ac8c3df2b25a8e5b6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ═══════════════════════════════════════════════════════
//  GLOBAL STATE
// ═══════════════════════════════════════════════════════
const STAGE_PALETTE = [
  {color:'#1D9E75',light:'var(--green-light)'},
  {color:'#378ADD',light:'var(--blue-light)'},
  {color:'#D85A30',light:'var(--orange-light)'},
  {color:'#7F77DD',light:'var(--purple-light)'},
  {color:'#EF9F27',light:'var(--amber-light)'}
];

let allProjects   = {};        
let currentProjId = null;
let projListener  = null;     
let state         = {};       
let STAGES        = [];       
let currentTab    = 'tasks';
let filterAssignee= 'all';
let filterStatus  = 'all';
let unseenLogs    = 0;
let isFirstLoad   = true;
let hideCompletedGantt = false;
let globalTasksData = [];
let showArchived = false;
let tempExcelStages = [];

const connectionTimeout = setTimeout(() => {
    const loader = document.getElementById('loading-overlay');
    if(loader && loader.style.display !== 'none') {
        loader.innerHTML = `
            <div class="error-box">
                <i class="ti ti-alert-triangle" style="font-size:36px;color:var(--red);margin-bottom:10px;"></i>

async function loadProjectList() {
  try {
    const snap = await db.collection('projects').get();
    allProjects = {};
    if (snap.empty) {
        try {
            const oldDoc = await db.collection('gantt').doc('pae_state_v1').get();
            if (oldDoc.exists) {
                const meta = { name: "Medición del desperdicio de alimentos · PAE", client: "JUNAEB", startDate: oldDoc.data().startDate || "2026-06-01", totalWeeks: 35, type: "proyecto", stages: [], accentColor: "#1D9E75", status: "active", createdAt: Date.now(), lastPct: 0 };
                const ref = await db.collection('projects').add(meta);
                await db.collection('projects').doc(ref.id).collection('runtime').doc('state').set(oldDoc.data());
                const snap2 = await db.collection('projects').get();
                snap2.forEach(doc => { allProjects[doc.id] = { meta: doc.data() }; });
                renderHome();
                clearTimeout(connectionTimeout);
                document.getElementById('loading-overlay').style.display = 'none';
                return; 
            }
        } catch(e) {}
    }
    snap.forEach(doc => { allProjects[doc.id] = { meta: doc.data() }; });
    renderHome();
  } catch(e) { console.error(e); } 
  finally { clearTimeout(connectionTimeout); const l = document.getElementById('loading-overlay'); if(l && !l.innerHTML.includes("Error")) l.style.display = 'none'; }
}

function renderHome() {
  const ids = Object.keys(allProjects);
  const el  = document.getElementById('home-projects-list');

  const activos    = ids.filter(id => allProjects[id].meta.type === 'proyecto' && allProjects[id].meta.status !== 'archived');
  const propuestas = ids.filter(id => allProjects[id].meta.type === 'propuesta' && allProjects[id].meta.status !== 'archived');
  const archivados = ids.filter(id => allProjects[id].meta.status === 'archived');

  let html = '';
  if (activos.length > 0) {
    html += `<div class="section-label"><i class="ti ti-briefcase"></i> Proyectos activos</div><div class="projects-grid">`;
    activos.forEach(id => html += buildProjectCard(id));
    html += `</div>`;
  }
  if (propuestas.length > 0) {
    html += `<div class="section-label"><i class="ti ti-file-description"></i> Propuestas técnicas / Pipeline</div><div class="projects-grid">`;
    propuestas.forEach(id => html += buildProjectCard(id));
    html += `</div>`;
  }

  html += `<div class="projects-grid"><div class="new-card" onclick="openNewProjectModal()"><i class="ti ti-plus"></i><span>Nuevo proyecto o propuesta</span></div></div>`;

  html += `<div style="text-align:center; margin-top:30px; border-top:1px solid var(--border); padding-top:20px;">
    <button class="btn" onclick="showArchived=!showArchived; renderHome()"><i class="ti ti-archive"></i> ${showArchived ? 'Ocultar' : 'Ver'} proyectos archivados (${archivados.length})</button>
  </div>`;

  if(showArchived && archivados.length > 0) {
    html += `<div class="projects-grid" style="margin-top:20px;">`;
    archivados.forEach(id => html += buildProjectCard(id));
    html += `</div>`;
  }
  
  el.innerHTML = html;
}

function buildProjectCard(id) {
  const m = allProjects[id].meta || {};
  const pct = m.lastPct || 0;
  const isArchived = m.status === 'archived';
  
  let badgeHtml = '';
  if (isArchived) {
      if (m.archiveReason === 'perdida') badgeHtml = '<span class="pc-type-badge badge-perdida" style="right:14px;">Propuesta Perdida</span>';
      else badgeHtml = '<span class="pc-type-badge badge-finalizado" style="right:14px;">Proyecto Finalizado</span>';
  } else {
      if (m.type === 'propuesta') badgeHtml = '<span class="pc-type-badge badge-propuesta">Postulada</span>';
      else badgeHtml = '<span class="pc-type-badge badge-proyecto">Proyecto Activo</span>';
  }

  let menuHtml = '';
  if (!isArchived) {
      menuHtml += `<div class="pc-dd-item" onclick="openProjectConfig(event, '${id}')"><i class="ti ti-edit"></i> Editar proyecto</div>`;
      if (m.type === 'propuesta') {
          menuHtml += `<div class="pc-dd-item" onclick="changeProjState(event, '${id}', 'adjudicada')"><i class="ti ti-trophy" style="color:var(--green)"></i> Adjudicada</div>`;
          menuHtml += `<div class="pc-dd-item" onclick="changeProjState(event, '${id}', 'perdida')"><i class="ti ti-x" style="color:var(--red)"></i> Perdida</div>`;
      } else {
          menuHtml += `<div class="pc-dd-item" onclick="changeProjState(event, '${id}', 'finalizado')"><i class="ti ti-archive"></i> Proyecto finalizado</div>`;
      }
  } else {
      menuHtml += `<div class="pc-dd-item" onclick="changeProjState(event, '${id}', 'restaurar')"><i class="ti ti-arrow-back-up"></i> Desarchivar</div>`;
  }
  menuHtml += `<div class="pc-dd-item pc-dd-danger" onclick="deleteProject(event, '${id}')"><i class="ti ti-trash"></i> Eliminar proyecto</div>`;

  // Mejora: Mostrar ID y Fecha de Adjudicación en propuestas
  let propMetaHtml = '';
  if (m.type === 'propuesta') {
      const isToday = m.fechaAdjudicacion === toYMD(new Date());
      const adjStyle = isToday ? 'background:var(--amber-light);color:#8a5c00;padding:2px 6px;border-radius:4px;font-weight:600;' : '';

      propMetaHtml = `
      <div style="font-size:11px; margin-bottom:8px; display:flex; flex-direction:column; gap:4px;">
          <div style="display:flex; align-items:center; gap:6px;">
              <span style="color:var(--text2)">ID Lic: <b>${m.idLicitacion || 'N/A'}</b></span>
              <i class="ti ti-copy" style="cursor:pointer;color:var(--blue);" title="Copiar ID" onclick="event.stopPropagation(); navigator.clipboard.writeText('${m.idLicitacion||''}'); alert('ID copiado al portapapeles');"></i>
          </div>
          <div style="color:var(--text2)">Adjudicación: <span style="${adjStyle}">${m.fechaAdjudicacion ? fmtShort(parseLocal(m.fechaAdjudicacion)) : '—'}</span></div>
      </div>`;
  }

  return `
    <div class="project-card ${isArchived ? 'archived' : ''}" onclick="openProject('${id}')">
      <div class="pc-accent" style="background:${m.accentColor||'var(--green)'}"></div>
      ${badgeHtml}
      
      <button class="pc-menu-btn" onclick="toggleMenu(event, 'menu-${id}')"><i class="ti ti-dots-vertical"></i></button>
      <div id="menu-${id}" class="pc-dropdown" onclick="event.stopPropagation()">${menuHtml}</div>

      <div class="pc-title">${m.name}</div>
      <div class="pc-client">${m.client||'Sin cliente'}</div>
      
      ${propMetaHtml}

      <div class="pc-meta">
        <span><i class="ti ti-calendar"></i> ${m.startDate||'—'}</span>
        <span><i class="ti ti-clock"></i> ${m.totalWeeks||0} sem</span>
        ${m.type==='proyecto' ? `<span><i class="ti ti-chart-pie"></i> ${pct}%</span>` : ''}
      </div>
      ${m.type==='proyecto' && !isArchived ? `<div class="pc-pbar"><div class="pc-pbar-inner" style="width:${pct}%;background:${m.accentColor||'var(--green)'}"></div></div>` : ''}
    </div>`;
}

function toggleMenu(event, menuId) {
    event.stopPropagation();
    document.querySelectorAll('.pc-dropdown').forEach(d => { if(d.id !== menuId) d.classList.remove('show'); });
    document.getElementById(menuId).classList.toggle('show');
}

function openProjectConfig(event, id) {
    event.stopPropagation();
    openProject(id);
    setTimeout(() => { setTab('config', document.querySelectorAll('.tab')[6]); }, 100);
}

async function changeProjState(event, id, action) {
    event.stopPropagation();
    try {
        const update = {};
        if (action === 'adjudicada') { update.type = 'proyecto'; update.proposalStatus = 'adjudicada'; update.status = 'active'; }
        else if (action === 'perdida') { update.status = 'archived'; update.archiveReason = 'perdida'; }
        else if (action === 'finalizado') { update.status = 'archived'; update.archiveReason = 'finalizado'; }
        else if (action === 'restaurar') { update.status = 'active'; update.archiveReason = null; update.proposalStatus = 'postulada'; } 

        await db.collection('projects').doc(id).update(update);
        allProjects[id].meta = { ...allProjects[id].meta, ...update };
        renderHome();
    } catch(e) { alert("Error actualizando estado."); }
}

async function deleteProject(event, id) {
  event.stopPropagation();
  if (!confirm(`¿Eliminar permanentemente el proyecto? Esta acción es irreversible.`)) return;
  try {
    await db.collection('projects').doc(id).collection('runtime').doc('state').delete();
    await db.collection('projects').doc(id).delete();
    delete allProjects[id]; renderHome();
  } catch(e) { alert('Error al eliminar.'); }
}

function downloadExcelTemplate() {
    if (typeof XLSX === 'undefined') { alert("La librería de Excel no ha cargado. Revisa tu conexión a internet."); return; }
    const ws_data = [
        ["Etapa", "Actividad", "Tipo (tarea/hito/producto/revision)", "Responsable", "Semana Inicio", "Semana Fin"],
        ["Fase 1: Preparación", "Reunión Kickoff", "hito", "Ana García", 1, 1],
        ["Fase 1: Preparación", "Elaborar Plan", "tarea", "Luis Pérez", 1, 2],
        ["Fase 2: Ejecución", "Trabajo de campo", "tarea", "María Soto", 3, 5],
        ["Fase 2: Ejecución", "Informe Final", "producto", "Ana García", 6, 6]
    ];
    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Actividades");
    XLSX.writeFile(wb, "Plantilla_Proyectos.xlsx");
}

function handleExcelFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('excel-status').innerText = "Procesando archivo...";
    const reader = new FileReader();
    reader.onload = function(evt) {
        try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet);
            const stageMap = {};
            json.forEach((row, i) => {
                const etapa = row['Etapa'] || 'Etapa 1';
                if(!stageMap[etapa]) stageMap[etapa] = [];
                stageMap[etapa].push({
                    id: `e${Date.now()}-${i}`, name: row['Actividad'] || 'Tarea sin nombre', type: (row['Tipo (tarea/hito/producto/revision)'] || 'tarea').toLowerCase(),
                    assignee: row['Responsable'] || '', week: parseInt(row['Semana Inicio']) || 1, weeks: [parseInt(row['Semana Inicio']) || 1, parseInt(row['Semana Fin']) || parseInt(row['Semana Inicio']) || 1]
                });
            });
            tempExcelStages = Object.keys(stageMap).map((k, i) => {
                const tasks = stageMap[k]; const allW = tasks.flatMap(t=>t.weeks||[t.week]);
                return { id: i+1, name: k, weeks: [Math.min(...allW), Math.max(...allW)], tasks };
            });
            document.getElementById('excel-status').innerHTML = `<b>¡Éxito!</b> ${tempExcelStages.length} etapas preparadas para importar.`;
            document.getElementById('excel-status').style.color = "var(--green)";
        } catch(err) {
            document.getElementById('excel-status').innerText = "Error leyendo Excel. Revisa el formato.";
            document.getElementById('excel-status').style.color = "var(--red)";
        }
    };
    reader.readAsArrayBuffer(file);
}

async function saveNewProject() {
  const name   = document.getElementById('np-name').value.trim();
  const client = document.getElementById('np-client').value.trim();
  const type   = document.getElementById('np-type').value;
  if (!name) { alert('El nombre es obligatorio.'); return; }

  let meta = {
    name, client, type, 
    accentColor: STAGE_PALETTE[Object.keys(allProjects).length % STAGE_PALETTE.length].color,
    status: 'active', createdAt: Date.now(), lastPct: 0
  };

  if(type === 'propuesta') {
      const lici = document.getElementById('np-licitacion').value.trim();
      const cie = document.getElementById('np-cierre').value;
      const adj = document.getElementById('np-adjudica').value;
      if(!lici || !cie || !adj) { alert('Licitación y Fechas son obligatorias para propuestas.'); return; }
      
      meta.idLicitacion = lici; meta.fechaCierre = cie; meta.fechaAdjudicacion = adj; meta.proposalStatus = 'postulada';
      meta.startDate = toYMD(new Date()); meta.totalWeeks = 4; // Por defecto corto
      
      // Tarea por defecto
      meta.stages = [{ id: 1, name: 'Fase de Postulación', weeks: [1,2], tasks: [{ id: 't1', name: 'Armado de propuesta', type: 'tarea', week: 1, weeks: [1,2], assignee: '' }] }];
  } else {
      meta.startDate = document.getElementById('np-start').value;
      meta.totalWeeks = parseInt(document.getElementById('np-weeks').value)||20;
      meta.stages = tempExcelStages.length > 0 ? tempExcelStages : [];
  }

  try {
    const ref = await db.collection('projects').add(meta);
    allProjects[ref.id] = { meta };
    tempExcelStages = [];
    closeModal();
    openProject(ref.id);
  } catch(e) { alert('Error al guardar.'); }
}

async function openGlobalTasks() {
    showScreen('global');
    document.getElementById('global-tasks-list').innerHTML = `<div style="text-align:center;padding:40px"><div class="spinner" style="margin:0 auto"></div><p>Extrayendo tareas de todos los proyectos activos...</p></div>`;
    
    globalTasksData = [];
    const activeIds = Object.keys(allProjects).filter(id => allProjects[id].meta.type === 'proyecto' && allProjects[id].meta.status !== 'archived');
    const promises = activeIds.map(id => db.collection('projects').doc(id).collection('runtime').doc('state').get().then(doc => {
        if(!doc.exists) return;
        const pState = doc.data(); const pMeta = allProjects[id].meta;
        const stgs = pMeta.stages || [];
        stgs.forEach(s => {
            s.tasks.forEach(t => {
                if(pState.deletedIds && pState.deletedIds.includes(t.id)) return;
                const ov = pState.taskOverrides && pState.taskOverrides[t.id];
                const finalT = { ...t, ...(ov||{}), pId: id, pName: pMeta.name, status: pState.statuses?.[t.id]||'pendiente' };
                let startStr = finalT.startDate;
                if(!startStr) {
                    const d = new Date(pMeta.startDate); d.setDate(d.getDate() + ((finalT.weeks ? finalT.weeks[0] : finalT.week) - 1)*7); startStr = toYMD(d);
                }
                finalT.time = parseLocal(startStr).getTime(); finalT.startStr = startStr;
                globalTasksData.push(finalT);
            });
        });
        (pState.customTasks||[]).forEach(t => {
            if(pState.deletedIds && pState.deletedIds.includes(t.id)) return;
            const ov = pState.taskOverrides && pState.taskOverrides[t.id];
            const finalT = { ...t, ...(ov||{}), pId: id, pName: pMeta.name, status: pState.statuses?.[t.id]||'pendiente' };
            finalT.time = finalT.startDate ? parseLocal(finalT.startDate).getTime() : new Date().getTime(); finalT.startStr = finalT.startDate;
            globalTasksData.push(finalT);
        });
    }));

    await Promise.all(promises);
    globalTasksData.sort((a,b) => a.time - b.time);
    renderGlobalTasks();
}

let globalFilterPerson = 'all';
let globalFilterProj = 'all';

function renderGlobalTasks() {
    const pOpts = Object.keys(allProjects).filter(id => allProjects[id].meta.type === 'proyecto' && allProjects[id].meta.status !== 'archived')
                    .map(id => `<option value="${id}">${allProjects[id].meta.name}</option>`).join('');

    const uOpts = Array.from(people).map(p => `<option value="${p}">${p}</option>`).join('');

    document.getElementById('global-filters').innerHTML = `
        <select onchange="globalFilterPerson=this.value; updateGlobalList()"><option value="all">Todas las personas del equipo</option>${uOpts}</select>
        <select onchange="globalFilterProj=this.value; updateGlobalList()"><option value="all">Todos los proyectos activos</option>${pOpts}</select>
    `;
    updateGlobalList();
}

function updateGlobalList() {
    const list = document.getElementById('global-tasks-list');
    const filtered = globalTasksData.filter(t => {
        let mP = globalFilterPerson === 'all' || t.assignee === globalFilterPerson;
        let mProj = globalFilterProj === 'all' || t.pId === globalFilterProj;
        return mP && mProj && t.status !== 'completado'; 
    });

    if(filtered.length === 0) { list.innerHTML = `<p style="padding:20px;text-align:center;color:var(--text3)">No hay tareas vigentes con estos filtros.</p>`; return; }

    list.innerHTML = filtered.map(t => `

            <div class="status-icon si-${t.status}">${getStatusIconHTML(t.status)}</div>
            <div style="flex:1;min-width:0">

            </div>
        </div>
    `).join('');
}


// ═══════════════════════════════════════════════════════
//  DENTRO DE PROYECTO: LÓGICA CORE
// ═══════════════════════════════════════════════════════
function openProject(id) {
  currentProjId = id;
  const meta = allProjects[id].meta || {};
  isFirstLoad = true; unseenLogs = 0;

  STAGES = (meta.stages || []).map((s, i) => ({ ...s, color: STAGE_PALETTE[i % STAGE_PALETTE.length].color, light: STAGE_PALETTE[i % STAGE_PALETTE.length].light }));

  document.getElementById('proj-title').textContent = meta.name;
  document.getElementById('proj-subtitle').textContent = `${meta.client||'Sin cliente'} · Inicio: ${fmtDateStr(meta.startDate)} · ${meta.totalWeeks||35} semanas`;
  setTab('tasks', document.querySelector('.tab'));
  showScreen('project');

  const stateRef = db.collection('projects').doc(id).collection('runtime').doc('state');
  if (projListener) projListener();
  projListener = stateRef.onSnapshot(doc => {
    if (doc.exists) {
      const oldLen = state.logs ? state.logs.length : 0;
      state = doc.data();
      ensureStateFallbacks(meta.startDate);
      if (state.logs.length > oldLen && !isFirstLoad) {
        unseenLogs += (state.logs.length - oldLen);
        updateNotifBadge();
      }
    } else {
      state = buildDefaultState(meta.startDate); saveState();
    }
    isFirstLoad = false;
    autoUpdateDelays(); renderAllViews(); renderNotifs();
    const s = calcStats();
    if ((meta.lastPct||0) !== s.pct) { db.collection('projects').doc(id).update({ lastPct: s.pct }); allProjects[id].meta.lastPct = s.pct; }
  });
}

function buildDefaultState(startDate) { return { startDate: startDate || '', statuses: {}, evaluations: {}, evaluationsClient: {}, notes: {}, collapsed: {}, ganttCollapsed: {}, taskOverrides: {}, customTasks: [], deletedIds: [], subtasks: {}, logs: [], team: [] }; }
function ensureStateFallbacks(startDate) {
  ['statuses','evaluations','evaluationsClient','notes','collapsed','ganttCollapsed','taskOverrides','subtasks'].forEach(k => { if(!state[k]) state[k]={}; });
  ['customTasks','deletedIds','logs','team'].forEach(k => { if(!state[k]) state[k]=[]; });
  if (!state.startDate) state.startDate = startDate || '';
}

function getRelWeek(dateInput) {
    const d = (typeof dateInput === 'string') ? parseLocal(dateInput) : dateInput;
    const start = getStartDate();
    if (isNaN(d) || isNaN(start)) return 1;
    return Math.max(1, Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(start.getFullYear(), start.getMonth(), start.getDate())) / 604800000) + 1);
}

function renderTasks() {
  const el = document.getElementById('tab-tasks');
  if (!el) return;
  const teamOpts = (state.team||[]).map(m => `<option value="${m.name}" ${filterAssignee===m.name?'selected':''}>${m.name}</option>`).join('');
  let html = `<div class="filter-bar"><select onchange="filterAssignee=this.value;renderTasks()"><option value="all">Todos los responsables</option>${teamOpts}<option value="unassigned" ${filterAssignee==='unassigned'?'selected':''}>Sin asignar</option></select><select onchange="filterStatus=this.value;renderTasks()"><option value="all">Todos los estados</option><option value="active" ${filterStatus==='active'?'selected':''}>Pendientes y En curso</option><option value="retrasado" ${filterStatus==='retrasado'?'selected':''}>Retrasados</option><option value="completado" ${filterStatus==='completado'?'selected':''}>Completados</option></select></div>`;

  STAGES.forEach(stage => {
    let fTasks = getAllTasks().filter(t => t.stageId===stage.id).filter(t => {
      let matchA = filterAssignee==='all' ? true : (filterAssignee==='unassigned' ? !t.assignee : t.assignee===filterAssignee);
      const st = getTaskStatus(t.id);
      let matchS = filterStatus==='all' ? true : (filterStatus==='active' ? (st==='pendiente'||st==='curso') : filterStatus===st);
      return matchA && matchS;
    }).sort((a,b) => getTaskDates(a).start - getTaskDates(b).start);
    
    if (fTasks.length===0) return;
    const done = fTasks.filter(t=>getTaskStatus(t.id)==='completado').length;
    const pct = fTasks.length ? Math.round(done/fTasks.length*100) : 0;
    const col = state.collapsed && state.collapsed[stage.id];
    
    html += `<div class="section"><div class="section-header" onclick="toggleSection(${stage.id})"><div class="section-title"><span style="width:10px;height:10px;border-radius:50%;background:${stage.color};display:inline-block"></span>${stage.name}</div><div class="section-meta"><span>${done}/${fTasks.length}</span><div class="pbar-sm"><div class="pbar-sm-inner" style="width:${pct}%;background:${stage.color}"></div></div><i class="ti ti-chevron-${col?'right':'down'}"></i></div></div>${col ? '' : renderTaskList(fTasks, stage)}</div>`;
  });
  el.innerHTML = html;
}

function renderTaskList(tasks, stage) {
  let html = '<div>';
  tasks.forEach(t => {
    const status = getTaskStatus(t.id);
    const { start, end } = getTaskDates(t);
    const dateLabel = `${fmtShort(start)} — ${fmtShort(end)} · S${getRelWeek(start)}`;
    const assigneeBadge = (t.assignee && typeof t.assignee==='string') ? `<span class="badge badge-tarea"><i class="ti ti-user"></i> ${t.assignee.split(' ')[0]}</span>` : '';
    
    // Progreso Subtareas
    const subs = state.subtasks && state.subtasks[t.id] ? state.subtasks[t.id] : [];
    let subProgHtml = '';
    if(subs.length > 0) {
        const dSub = subs.filter(s=>s.status==='completado').length;
        const pSub = Math.round((dSub/subs.length)*100);
        subProgHtml = `<span style="font-size:10px;color:var(--blue);margin-left:8px"><i class="ti ti-list-check"></i> ${dSub}/${subs.length} (${pSub}%)</span><div class="sub-prog-bar"><div class="sub-prog-inner" style="width:${pSub}%"></div></div>`;
    }

    html += `<div class="task-row${status==='completado'?' done':''}" onclick="openTask('${t.id}',${stage.id})">
      <div class="status-icon si-${status}" onclick="quickToggle(event,'${t.id}')">${getStatusIconHTML(status)}</div>
      <div class="task-info"><div class="task-name">${t.name}</div><div class="task-date"><i class="ti ti-calendar-event"></i> ${dateLabel} ${subProgHtml}</div></div>
      <div class="task-right">${assigneeBadge}${badge(t.type)}</div>
    </div>`;
    
    subs.forEach(s => {
      const sst = s.status||'pendiente';
      const sassg = s.assignee ? ` <i class="ti ti-user"></i> ${s.assignee.split(' ')[0]}` : '';
      html += `<div class="subtask-indented ${sst==='completado'?'done':''}" onclick="openTask('${t.id}',${stage.id})">
        <i class="ti ti-${sst==='completado'?'check-box':'square'}" onclick="event.stopPropagation(); toggleSubM('${t.id}','${s.id}')" style="color:${sst==='completado'?'var(--green)':'var(--text3)'}; font-size:16px; cursor:pointer;"></i>

  return html;

function renderGantt() {
  const el = document.getElementById('tab-gantt');
  if (!el) return;
  const meta = currentProjId ? allProjects[currentProjId].meta : {};
  const TOTAL_W = meta.totalWeeks || 35; const TOTAL_D = TOTAL_W * 7;
  const projStart = getStartDate(); const tf = todayFraction();
  
  let monthsHtml = ''; let currentM = ''; let wCount = 0;
  for (let w = 1; w <= TOTAL_W; w++) {
      const date = weekStart(w);
      const mStr = date.toLocaleDateString('es-CL', { month: 'short', year: '2-digit' }).replace(' de ', ' '); 
      if (mStr !== currentM) {
          if (wCount > 0) monthsHtml += `<div class="month-col" style="flex:${wCount};">${currentM}</div>`;
          currentM = mStr; wCount = 1;
      } else wCount++;
  }
  if (wCount > 0) monthsHtml += `<div class="month-col" style="flex:${wCount};">${currentM}</div>`;

  let html = `<div class="gantt-wrap"><div class="gantt-inner">
    <div class="gantt-head-row"><div>Actividad</div><div class="month-labels">${monthsHtml}</div></div>`;

  STAGES.forEach(stage => {
    let stageTasks = getAllTasks().filter(t=>t.stageId===stage.id).sort((a,b)=>getTaskDates(a).start-getTaskDates(b).start);
    if (!stageTasks.length) return;
    const scol = state.ganttCollapsed && state.ganttCollapsed[stage.id];
    
    let stageBarHtml = `<div></div>`;
    let minS = Infinity, maxE = -Infinity;
    stageTasks.forEach(t => {
        const {start, end} = getTaskDates(t);
        if(!isNaN(start) && start.getTime() < minS) minS = start.getTime();
        if(!isNaN(end) && end.getTime() > maxE) maxE = end.getTime();
    });
    if(minS !== Infinity && maxE !== -Infinity) {
        const sD = Math.floor((minS - projStart.getTime())/(24*3600*1000));
        const eD = Math.floor((maxE - projStart.getTime())/(24*3600*1000));
        const sLeft = Math.max(0, (sD/TOTAL_D)*100);
        const sWidth = Math.max(0.5, ((eD - sD + 1)/TOTAL_D)*100);
        stageBarHtml = `<div class="gantt-bar-cell"><div class="gantt-bar" style="left:${sLeft}%;width:${sWidth}%;background:${stage.color};opacity:0.25;border-radius:4px"></div></div>`;
    }

    html += `<div class="gantt-row" style="background:${stage.light}; cursor:pointer; user-select:none;" onclick="toggleGanttSection(${stage.id})">
      <div style="font-weight:600; font-size:12px; display:flex; align-items:center; gap:6px; z-index:3; color:${stage.color}">
        <i class="ti ti-chevron-${scol?'right':'down'}" style="font-size:14px;color:${stage.color}"></i>
        <span style="width:8px;height:8px;border-radius:50%;background:${stage.color};display:inline-block;flex-shrink:0"></span>
        ${stage.name}
      </div>
      ${stageBarHtml}
    </div>`;
    
    if (!scol) {
      stageTasks.forEach(t => {
        const status = getTaskStatus(t.id);
        const { start, end } = getTaskDates(t);
        const startD  = Math.floor((start - projStart)/(24*3600*1000));
        const endD    = Math.floor((end - projStart)/(24*3600*1000));
        const leftPct = Math.max(0,(startD/TOTAL_D)*100);
        const widthPct= Math.max(.5,((endD-startD+1)/TOTAL_D)*100);
        
        let barColor = status==='completado'?'var(--green)': status==='retrasado'?'var(--red)': status==='curso'?'var(--blue)':stage.color;
        
        if(t.type === 'revision') {
           barStyle = `background: repeating-linear-gradient(45deg, ${barColor}, ${barColor} 6px, rgba(255,255,255,0.4) 6px, rgba(255,255,255,0.4) 12px);`;
        }

        const safeName = (t.name||'').replace(/"/g, '&quot;');
        
        /* MEJORA 1: Cursor Manito */
        html += `<div class="gantt-row" style="cursor:pointer; user-select:none;" onclick="openTask('${t.id}',${stage.id})">
          <div style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:8px;color:${status==='completado'?'var(--text3)':'var(--text)'}${status==='completado'?';text-decoration:line-through':''}" title="${safeName}">${t.name}</div>
          <div class="gantt-bar-cell">
            <div class="gantt-today-line" style="left:${tf*100}%"></div>
            <div class="gantt-bar" style="left:${leftPct}%; width:${widthPct}%; background:${barColor}; ${status==='completado'?';opacity:.5':''}" title="${safeName}"></div>
          </div>
        </div>`;
      });
    }
  });
  el.innerHTML = html + '</div></div>';
}

function toggleGanttSection(id) {
  if (!state.ganttCollapsed) state.ganttCollapsed = {};
  state.ganttCollapsed[id] = !state.ganttCollapsed[id];
  saveState();
}

function getNextUpcoming(type) {
   const all = getAllTasks();
   const items = all.filter(t => t.type === type && getTaskStatus(t.id) !== 'completado');
   const today = new Date(); today.setHours(0,0,0,0);
   let next = null; let minDiff = Infinity;
   items.forEach(h => {
       const { start } = getTaskDates(h);
       const startNoTime = new Date(start); startNoTime.setHours(0,0,0,0);
       const diff = Math.ceil((startNoTime - today) / (1000*3600*24));
       if (diff >= 0 && diff < minDiff) { minDiff = diff; next = h; }
   });
   return { item: next, days: minDiff };
}

function getShareText() {
    const s = calcStats(); 
    const cw = currentWeek(); 
    const nm = getNextUpcoming('hito'); 
    const np = getNextUpcoming('producto');
    let hitoText = nm.item ? `${nm.item.name} (en ${nm.days} días)` : "Ninguno pendiente";
    let prodText = np.item ? `${np.item.name} (en ${np.days} días)` : "Ninguno pendiente";
    const meta = currentProjId ? allProjects[currentProjId].meta : {};

    // MEJORA 2: Formato limpio y estructurado visualmente
    return `📊 [${(meta.name||'PROYECTO').toUpperCase()}]\nSemana actual: S${cw} (${fmtShort(weekStart(cw))} – ${fmtShort(weekEnd(cw))})\nProgreso: ${s.pct}% (${s.done}/${s.total} actividades completadas)\n- Completadas: ${s.counts.completado}\n- En curso: ${s.counts.curso}\n- Pendientes: ${s.counts.pendiente}\n- Retrasadas: ${s.counts.retrasado}\n\nPróximo producto: ${prodText}\nPróximo hito: ${hitoText}\n\nGenerado: ${fmtDate(new Date())} a las ${new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}`;
}

function openTask(taskId, stageId) {
  const t = getAllTasks().find(x => x.id===taskId);
  if (!t) return;
  const stage  = STAGES.find(s=>s.id===stageId)||{name:'',color:'var(--border2)'};
  const status = getTaskStatus(taskId);
  const { start, end } = getTaskDates(t);
  const note   = state.notes&&state.notes[taskId]||'';
  const sdInput= !isNaN(start) ? toYMD(start) : '';
  const edInput= !isNaN(end) ? toYMD(end) : '';
  const teamOpts= (state.team||[]).map(m=>`<option value="${m.name}" ${t.assignee===m.name?'selected':''}>${m.name}</option>`).join('');
  const gcalLink= generateGCalLink(t);

  const isProd = t.type==='producto';
  const isRev  = t.type==='revision';
  const ev     = state.evaluations&&state.evaluations[taskId]||0;
  const evC    = state.evaluationsClient&&state.evaluationsClient[taskId]||0;
  
  let evalSection = '';
  if (isProd) {
    evalSection = `
    <div style="background:var(--green-light);border:1px solid var(--green);border-radius:var(--radius);padding:12px;margin-bottom:12px">
      <div class="eval-section">
        <h4 style="color:var(--green);"><i class="ti ti-star-filled"></i> Autoevaluación del equipo</h4>
        <div class="stars-input" id="modal-stars" style="display:flex;align-items:center;">
          <div>${[1,2,3,4,5].map(i=>`<button class="star-btn ${ev>=i?'on-green':''}" onclick="setEvM('${taskId}',${i},false)">★</button>`).join('')}</div>
          <span style="font-size:11px;color:var(--green);margin-left:12px;cursor:pointer;text-decoration:underline" onclick="setEvM('${taskId}',0,false)">Desmarcar</span>
        </div>
      </div>
    </div>`;
  } else if (isRev) {
    evalSection = `
    <div style="background:var(--amber-light);border:1px solid var(--amber);border-radius:var(--radius);padding:12px;margin-bottom:12px">
      <div class="eval-section">
        <h4 style="color:#a87000;"><i class="ti ti-building-bank"></i> Feedback de la Contraparte</h4>
        <div class="stars-input" id="modal-stars-client" style="display:flex;align-items:center;">
          <div>${[1,2,3,4,5].map(i=>`<button class="star-btn ${evC>=i?'on':''}" onclick="setEvM('${taskId}',${i},true)">★</button>`).join('')}</div>
          <span style="font-size:11px;color:#a87000;margin-left:12px;cursor:pointer;text-decoration:underline" onclick="setEvM('${taskId}',0,true)">Desmarcar</span>
        </div>
      </div>
    </div>`;
  }

  const subs = state.subtasks&&state.subtasks[taskId] ? state.subtasks[taskId] : [];
  let subsHTML = `
    <div style="margin-bottom:12px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:12px;">
      <p style="font-size:12px;font-weight:500;margin-bottom:8px;color:var(--text2)"><i class="ti ti-list-check"></i> Subtareas y Desglose</p>
      ${subs.length === 0 ? '<p style="font-size:11px;color:var(--text3);margin-bottom:8px">No hay subtareas. Puedes agregar micro-actividades aquí.</p>' : ''}
      
      <div style="margin-bottom:8px">
        ${subs.map((s,si)=>{
          const sTeam = (state.team||[]).map(m=>`<option value="${m.name}" ${s.assignee===m.name?'selected':''}>${m.name}</option>`).join('');
          return `
        <div class="sub-row">
          <i class="ti ti-${s.status==='completado'?'check-box':'square'}" style="color:${s.status==='completado'?'var(--green)':'var(--text3)'}; font-size:18px; cursor:pointer;" onclick="toggleSubM('${taskId}','${s.id}')"></i>
          <input type="text" value="${(s.name||'').replace(/"/g, '&quot;')}" onchange="updateSubM('${taskId}','${s.id}','name',this.value)" placeholder="Descripción de subtarea" style="flex:1;min-width:0"/>
          <select onchange="updateSubM('${taskId}','${s.id}','assignee',this.value)">
              <option value="" disabled hidden ${!s.assignee?'selected':''}>Responsable...</option>
              <option value="">Sin asignar</option>
              ${sTeam}
          </select>
          <input type="date" value="${s.date||''}" onchange="updateSubM('${taskId}','${s.id}','date',this.value)"/>
          <i class="ti ti-trash" onclick="deleteSubM('${taskId}','${s.id}')" style="cursor:pointer; color:var(--red); font-size:16px; margin-left:4px;"></i>
        </div>`
        }).join('')}
      </div>
      <div style="display:flex;gap:6px">
        <input id="new-sub-name" type="text" placeholder="Escribe una nueva subtarea..." style="flex:1;padding:6px 8px;border:1px solid var(--border2);border-radius:4px;font-size:12px;background:var(--bg);color:var(--text);outline:none"/>
        <button class="btn btn-sm btn-primary" onclick="addSubM('${taskId}')"><i class="ti ti-plus"></i></button>
      </div>
    </div>`;

  modal(`
    <h3 style="margin-bottom:4px">${t.name}</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:14px"><span style="width:8px;height:8px;border-radius:50%;background:${stage.color};display:inline-block;margin-right:4px"></span>${stage.name} · ${badge(t.type)}</p>
    <div class="form-row">
      <label>Responsable General</label>
      <select id="modal-assignee">
        <option value="" disabled hidden ${!t.assignee?'selected':''}>Responsable...</option>
        <option value="">Sin asignar</option>
        ${teamOpts}
      </select>
    </div>
    <div class="form-row">
      <label>Fechas exactas (inicio – fin)</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <input id="modal-start" type="date" value="${sdInput}"/>
        <input id="modal-end"   type="date" value="${edInput}"/>
      </div>
    </div>
    <div class="form-row">
      <a href="${gcalLink}" target="_blank" class="btn" style="width:100%;justify-content:center;border-color:var(--blue);color:var(--blue)">
        <i class="ti ti-calendar-plus"></i> Agregar a Google Calendar
      </a>
    </div>
    <div class="form-row" style="margin-top:16px">
      <label>Estado Principal</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn${status==='pendiente'?' btn-primary':''}" id="btn-st-pendiente" onclick="setStM('${taskId}','pendiente')"><i class="ti ti-circle"></i> Pendiente</button>
        <button class="btn${status==='curso'?' btn-blue':''}" id="btn-st-curso" onclick="setStM('${taskId}','curso')"><i class="ti ti-player-play"></i> En curso</button>
        <button class="btn${status==='retrasado'?' btn-red':''}" id="btn-st-retrasado" onclick="setStM('${taskId}','retrasado')"><i class="ti ti-alert-circle"></i> Retrasado</button>
        <button class="btn${status==='completado'?' btn-primary':''}" id="btn-st-completado" onclick="setStM('${taskId}','completado')"><i class="ti ti-circle-check"></i> Completado</button>
      </div>
    </div>
    ${subsHTML}${evalSection}
    <div class="form-row">
      <label>Notas y observaciones</label>
      <textarea id="modal-note" placeholder="Escribe aquí los comentarios...">${note}</textarea>
    </div>
    <div class="modal-actions" style="justify-content:space-between">
      <button class="btn btn-danger" style="background:transparent;border:1px solid #fcc;color:#c00" onclick="deleteTaskModal('${taskId}')"><i class="ti ti-trash"></i> Eliminar</button>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveTaskModal('${taskId}')"><i class="ti ti-check"></i> Guardar cambios</button>
      </div>
    </div>`);
}

function setStM(id, val) {
  state.statuses[id] = val;
  ['pendiente','curso','retrasado','completado'].forEach(st => {
    const b = document.getElementById('btn-st-'+st);
    if (b) b.className = 'btn';
  });
  const b = document.getElementById('btn-st-'+val);
  if (b) b.className = val==='curso'?'btn btn-blue':(val==='retrasado'?'btn btn-red':'btn btn-primary');
}

function setEvM(id, val, isClient) {
  if (isClient) {
    if (!state.evaluationsClient) state.evaluationsClient = {};
    if (state.evaluationsClient[id]===val) val=0;
    state.evaluationsClient[id] = val;
    document.querySelectorAll('#modal-stars-client .star-btn').forEach((b,i)=>b.className='star-btn'+(val>=i+1?' on':''));
  } else {
    if (!state.evaluations) state.evaluations = {};
    if (state.evaluations[id]===val) val=0;
    state.evaluations[id] = val;
    document.querySelectorAll('#modal-stars .star-btn').forEach((b,i)=>b.className='star-btn'+(val>=i+1?' on-green':''));
  }
}

function addSubM(parentId) {
  const name = document.getElementById('new-sub-name').value.trim();
  if (!name) return;
  if (!state.subtasks) state.subtasks = {};
  if (!state.subtasks[parentId]) state.subtasks[parentId] = [];
  state.subtasks[parentId].push({ id:'sub'+Date.now(), name, status:'pendiente', assignee:'', date:'' });
  logAction(`Se agregó una subtarea en una actividad.`);
  saveState();
  openTask(parentId, getAllTasks().find(t=>t.id===parentId).stageId);
}

function updateSubM(pId, sId, field, val) {
  const sub = state.subtasks[pId].find(s=>s.id===sId);
  if (sub) { sub[field]=val; saveState(); }
}

function toggleSubM(pId, sId) {
  const sub = state.subtasks[pId].find(s=>s.id===sId);
  if (sub) {
    const wasDone = sub.status === 'completado';
    sub.status = wasDone ? 'pendiente' : 'completado';
    
    const allSubs = state.subtasks[pId];
    if (allSubs && allSubs.length > 0) {
        const allDone = allSubs.every(s => s.status === 'completado');
        if (allDone && state.statuses[pId] !== 'completado') {
            state.statuses[pId] = 'completado';
            logAction(`Actividad completada automáticamente (Subtareas listas).`);
        } else if (!allDone && state.statuses[pId] === 'completado') {
            state.statuses[pId] = 'curso'; 
            logAction(`Actividad reabierta (Subtarea desmarcada).`);
        }
    }

    saveState();
    if(document.getElementById('modal-root').innerHTML.trim() !== '') {
        openTask(pId, getAllTasks().find(t=>t.id===pId).stageId);
    }
  }
}

function deleteSubM(pId, sId) {
  state.subtasks[pId] = state.subtasks[pId].filter(s=>s.id!==sId);
  saveState();
  openTask(pId, getAllTasks().find(t=>t.id===pId).stageId);
}

function saveTaskModal(id) {
  const t    = getAllTasks().find(x=>x.id===id);
  const oldA = t.assignee;
  const oldSt= getTaskStatus(id);
  if (!state.notes) state.notes = {};
  state.notes[id] = document.getElementById('modal-note').value;
  const start   = document.getElementById('modal-start').value;
  const end     = document.getElementById('modal-end').value;
  const assignee= document.getElementById('modal-assignee').value;
  if (oldA!==assignee && assignee!=='') logAction(`Se asignó una tarea a ${assignee}.`);
  if (oldSt!==state.statuses[id]) logAction(`Cambio de estado a ${state.statuses[id]} en una actividad.`);
  if (!state.taskOverrides) state.taskOverrides = {};
  state.taskOverrides[id] = { startDate: start, endDate: end, assignee };
  if (state.customTasks) {
    const ct = state.customTasks.find(x=>x.id===id);
    if (ct) { ct.startDate=start; ct.endDate=end; ct.assignee=assignee; }
  }
  saveState(); closeModal();
}

function deleteTaskModal(id) {
  if (!confirm('¿Eliminar esta actividad permanentemente?')) return;
  if (!state.deletedIds) state.deletedIds = [];
  state.deletedIds.push(id);
  logAction(`Se eliminó una actividad.`);
  saveState(); closeModal();
}

// ═══════════════════════════════════════════════════════
//  AGREGAR TAREA NUEVA
// ═══════════════════════════════════════════════════════
function openAddTask(stageId) {
  if (!stageId) stageId = STAGES[0]&&STAGES[0].id||1;
  const teamOpts= (state.team||[]).map(m=>`<option value="${m.name}">${m.name}</option>`).join('');
  const sd = toYMD(new Date());
  modal(`<h3>Nueva actividad</h3>
    <div class="form-row"><label>Nombre de la actividad</label><input id="nt-name" type="text" placeholder="Ej: Reunión de seguimiento"/></div>
    <div class="form-row"><label>Etapa</label><select id="nt-stage">${STAGES.map(s=>`<option value="${s.id}"${s.id==stageId?' selected':''}>${s.name}</option>`).join('')}</select></div>
    
    <div class="form-row">
      <label>Tipo</label>
      <select id="nt-type">
        <option value="tarea">Tarea</option>
        <option value="hito">Hito</option>
        <option value="producto">Producto</option>
        <option value="revision">Revisión contraparte</option>
      </select>
    </div>
    
    <div class="form-row"><label>Responsable</label><select id="nt-assignee"><option value="" disabled hidden selected>Responsable...</option><option value="">Sin asignar</option>${teamOpts}</select></div>
    <div class="form-row"><label>Fechas (inicio – fin)</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <input id="nt-start" type="date" value="${sd}"/>
        <input id="nt-end"   type="date" value="${sd}"/>
      </div>
    </div>
    <div class="form-row"><label>Notas (opcional)</label><textarea id="nt-note" placeholder="Descripción..."></textarea></div>
    
    <div style="font-size:11px; color:var(--text2); background:var(--bg2); padding:10px; border-radius:var(--radius); margin-bottom:14px; border:1px solid var(--border);">
      <i class="ti ti-info-circle"></i> <b>Nota:</b> Podrás agregar Subtareas y sincronizar con Google Calendar una vez que guardes esta actividad.
    </div>

    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveNewTask()"><i class="ti ti-plus"></i> Guardar actividad</button></div>`);
}

function saveNewTask() {
  const name = document.getElementById('nt-name').value.trim();
  if (!name) return;
  const stageId = parseInt(document.getElementById('nt-stage').value);
  const stage   = STAGES.find(s=>s.id===stageId)||{color:'#ccc',light:'var(--bg2)'};
  const id = 'c'+Date.now();
  if (!state.customTasks) state.customTasks = [];
  state.customTasks.push({
    id, name, stageId,
    type:       document.getElementById('nt-type').value,
    startDate:  document.getElementById('nt-start').value,
    endDate:    document.getElementById('nt-end').value,
    assignee:   document.getElementById('nt-assignee').value,
    stageColor: stage.color,
    stageLight: stage.light
  });
  logAction(`Agregó la nueva actividad: '${name}'.`);
  saveState(); closeModal();
}

// ═══════════════════════════════════════════════════════
//  GOOGLE CALENDAR LINK
// ═══════════════════════════════════════════════════════
function generateGCalLink(task) {
  try {
    const { start, end } = getTaskDates(task);
    if (!start || !end || isNaN(start) || isNaN(end)) return '#';
    const s = start.toISOString().replace(/-|:|\.\d+/g, '').slice(0,8);
    const endPlusOne = new Date(end);
    endPlusOne.setDate(endPlusOne.getDate() + 1);
    const endStr = endPlusOne.toISOString().replace(/-|:|\.\d+/g, '').slice(0,8);
    const meta = currentProjId ? allProjects[currentProjId].meta : {};
    const safeName = encodeURIComponent(task.name || '');
    const safeDetails = encodeURIComponent(`Responsable: ${task.assignee || 'Sin asignar'}\n\nProyecto: ${meta.name||''}`);
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${safeName}&dates=${s}/${endStr}&details=${safeDetails}`;
  } catch(e) {
    return '#';
  }
}

// ═══════════════════════════════════════════════════════
//  MODAL GENERAL
// ═══════════════════════════════════════════════════════
function modal(html, large=false) {
  document.getElementById('modal-root').innerHTML =
    `<div class="modal-bg" onclick="closeModalBg(event)">
      <div class="modal${large?' modal-lg':''}" onclick="event.stopPropagation()">${html}</div>
    </div>`;
}
function closeModal() { document.getElementById('modal-root').innerHTML=''; }
function closeModalBg(e) { if(e.target===e.currentTarget) closeModal(); }

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
window.onload = () => loadProjectList();
</script>
